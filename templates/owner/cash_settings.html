{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card shadow-sm">
                <div class="card-header bg-white">
                    <h4 class="mb-0">Cash Payment Settings</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <h5 class="mb-3">System Mode</h5>
                        <div class="mb-4">
                            <div class="form-check mb-2">
                                <input type="checkbox" name="cash_development_mode" id="cash_development_mode" class="form-check-input" {{ 'checked' if settings.cash_development_mode else '' }}>
                                <label class="form-check-label" for="cash_development_mode">Development Mode (bypass all fraud checks)</label>
                            </div>
                            <div class="form-text">When enabled, all fraud protection checks are bypassed for testing. Disable in production.</div>
                        </div>

                        <h5 class="mb-3">Global Cash Enable</h5>
                        <div class="mb-4">
                            <div class="form-check">
                                <input type="checkbox" name="cash_globally_enabled" id="cash_globally_enabled" class="form-check-input" {{ 'checked' if settings.cash_globally_enabled else '' }}>
                                <label class="form-check-label" for="cash_globally_enabled">Enable Cash Payments System-Wide</label>
                            </div>
                        </div>

                        <h5 class="mb-3">Guest Verification Requirements</h5>
                        <div class="mb-4">
                            <div class="form-check mb-2">
                                <input type="checkbox" name="cash_requires_kyc" id="cash_requires_kyc" class="form-check-input" {{ 'checked' if settings.cash_requires_kyc else '' }}>
                                <label class="form-check-label" for="cash_requires_kyc">Require KYC for Cash</label>
                            </div>
                            <div class="row mt-2">
                                <div class="col-md-4">
                                    <label class="form-label">Minimum KYC Level</label>
                                    <input type="number" name="cash_min_kyc_level" class="form-control" value="{{ settings.cash_min_kyc_level or 2 }}" min="0">
                                </div>
                            </div>
                            <div class="form-check mt-2">
                                <input type="checkbox" name="cash_requires_verified_phone" id="cash_requires_verified_phone" class="form-check-input" {{ 'checked' if settings.cash_requires_verified_phone else '' }}>
                                <label class="form-check-label" for="cash_requires_verified_phone">Require Phone Verification</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" name="cash_requires_verified_email" id="cash_requires_verified_email" class="form-check-input" {{ 'checked' if settings.cash_requires_verified_email else '' }}>
                                <label class="form-check-label" for="cash_requires_verified_email">Require Email Verification</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" name="cash_requires_previous_booking" id="cash_requires_previous_booking" class="form-check-input" {{ 'checked' if settings.cash_requires_previous_booking else '' }}>
                                <label class="form-check-label" for="cash_requires_previous_booking">Require Previous Booking</label>
                            </div>
                        </div>

                        <h5 class="mb-3">Fraud Protection Limits</h5>
                        <div class="mb-4">
                            <div class="row">
                                <div class="col-md-6">
                                    <label class="form-label">Maximum Cash Amount (UGX)</label>
                                    <input type="number" name="cash_max_amount" class="form-control" value="{{ settings.cash_max_amount or 500000 }}" min="0" step="0.01">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Default Deposit Percentage (%)</label>
                                    <input type="number" name="cash_default_deposit_pct" class="form-control" value="{{ settings.cash_default_deposit_pct or 30 }}" min="0" max="100" step="0.01">
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">Save Cash Settings</button>
                        <a href="{{ url_for('admin.owner.dashboard') }}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
