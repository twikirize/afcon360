{% extends "transport/base.html" %}
{% block title %}Report Incident{% endblock %}
{% block breadcrumb %}
<span class="sep">/</span><a href="{{ safe_url('transport.incidents_index') }}">Incidents</a>
<span class="sep">/</span><span class="current">New</span>
{% endblock %}

{% block content %}
<div class="page-header">
  <div class="page-header-left">
    <h1 class="page-title">Report Incident</h1>
    <p class="page-subtitle">File a new transport incident report</p>
  </div>
</div>

<form method="POST" action="{{ safe_url('transport.incidents_new') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="card" style="margin-bottom:16px;">
    <div class="card-header"><span class="card-title">Incident Details</span></div>
    <div class="card-body">
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label">Type <span class="req">*</span></label>
          <input name="incident_type" class="form-control" required placeholder="e.g. driver_conduct, vehicle_issue" />
        </div>
        <div class="form-group">
          <label class="form-label">Severity <span class="req">*</span></label>
          <select name="severity" class="form-control" required>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Title <span class="req">*</span></label>
        <input name="title" class="form-control" required maxlength="200" />
      </div>
      <div class="form-group">
        <label class="form-label">Description <span class="req">*</span></label>
        <textarea name="description" class="form-control" rows="5" required></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Occurred At <span class="req">*</span></label>
        <input name="occurred_at" type="datetime-local" class="form-control" required />
      </div>
    </div>
  </div>
  <div class="page-actions">
    <a href="{{ safe_url('transport.incidents_index') }}" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-triangle-exclamation"></i> Submit</button>
  </div>
</form>
{% endblock %}
