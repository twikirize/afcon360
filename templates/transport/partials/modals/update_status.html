{# Reusable status update modal. Expects $currentStatus, $targetStatus variables from include context. #}
<div id="statusModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;align-items:center;justify-content:center;"
     onclick="if(event.target===this)this.style.display='none'">
  <div class="card" style="max-width:420px;width:90%;margin:0;">
    <div class="card-header"><span class="card-title">Update Status</span></div>
    <div class="card-body">
      <p style="font-size:0.86rem;color:var(--text-secondary);margin-bottom:16px;">
        Transition booking from <strong>{{ currentStatus|default('current')|replace('_',' ')|title }}</strong>
        to <strong>{{ targetStatus|default('next')|replace('_',' ')|title }}</strong>?
      </p>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button type="button" class="btn btn-secondary" onclick="document.getElementById('statusModal').style.display='none'">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmStatusBtn">Confirm</button>
      </div>
    </div>
  </div>
</div>
