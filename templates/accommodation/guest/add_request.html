{% extends "base.html" %}
{% block title %}Add a Request - AFCON360{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center"><div class="col-12 col-lg-7">
    <div class="card shadow-sm"><div class="card-body">
      <h1 class="h4">Need anything from your host?</h1>
      <p class="text-muted">Optional — your host will review and confirm what can be accommodated.</p>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label" for="request_type">Request type</label>
        <select class="form-select mb-3" id="request_type" name="request_type">
          <option value="other">Something else</option>
          <option value="late_checkout">Late checkout</option>
          <option value="extra_bedding">Extra bedding</option>
        </select>
        <label class="form-label" for="request_text">Your request</label>
        <textarea class="form-control mb-3" id="request_text" name="request_text" rows="4" maxlength="4000" required></textarea>
        <button class="btn btn-primary" type="submit">Send request</button>
        <a class="btn btn-link" href="{{ safe_url('accommodation.guest_confirmation', reference=booking.booking_reference) }}">Skip for now</a>
      </form>
    </div></div>
  </div></div>
</div>
{% endblock %}
