<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AFCON360 System Alert</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px;">
  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; border-top: 5px solid #d93025;">
    <h2 style="color: #d93025; margin-top: 0;">AFCON360 System Alert</h2>
    <p>Dear <strong>{{ user_name }}</strong>,</p>
    <p><strong>{{ alert_title }}</strong></p>
    <p>{{ alert_message }}</p>
    <p style="color: #555; font-size: 14px;">This is an automated system notification from AFCON360 East Africa Pamoja.</p>
  </div>
</body>
</html>
