<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AFCON360 Review Received</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px;">
  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; border-top: 5px solid #fcd116;">
    <h2 style="color: #1e293b; margin-top: 0;">AFCON360 New Review Received</h2>
    <p>Dear <strong>{{ user_name }}</strong>,</p>
    <p>You received a <strong>{{ rating }}-star review</strong> for <strong>{{ property_title }}</strong>.</p>
    <p><strong>Reviewer:</strong> {{ reviewer_name }}</p>
    <p><strong>Comment:</strong> {{ review_comment }}</p>
    <p style="color: #555; font-size: 14px;">Thank you for providing excellent service on AFCON360!</p>
  </div>
</body>
</html>
