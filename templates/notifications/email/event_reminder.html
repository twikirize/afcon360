<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AFCON360 Event Reminder</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px;">
  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; border-top: 5px solid #008751;">
    <h2 style="color: #008751; margin-top: 0;">Upcoming Event Alert: {{ event_title or 'Your Event' }}</h2>
    <p>Hi <strong>{{ user_name or 'Valued Fan' }}</strong>,</p>
    <p>This is a reminder that <strong>{{ event_title or 'your event' }}</strong> takes place at {{ venue or 'the venue' }} on {{ event_date or 'the scheduled date' }}.</p>
    <p style="color: #555; font-size: 14px;">Have your QR pass ready in your AFCON360 App.</p>
  </div>
</body>
</html>
