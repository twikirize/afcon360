<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AFCON360 Password Reset</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px;">
  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; border-top: 5px solid #1e88e5;">
    <h2 style="color: #1e88e5; margin-top: 0;">AFCON360 Password Reset</h2>
    <p>Dear <strong>{{ user_name }}</strong>,</p>
    <p>You requested a password reset. Click the link below to reset your password:</p>
    <p style="text-align: center; margin: 20px 0;">
      <a href="{{ reset_link }}" style="background-color: #008751; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px;">Reset Password</a>
    </p>
    <p>This link expires in 24 hours.</p>
    <p>If you did not request this reset, please ignore this email.</p>
    <p style="color: #555; font-size: 14px;">AFCON360 East Africa Pamoja!</p>
  </div>
</body>
</html>
