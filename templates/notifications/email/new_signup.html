<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AFCON360 New Signup</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px;">
  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; border-top: 5px solid #1e88e5;">
    <h2 style="color: #1e88e5; margin-top: 0;">AFCON360 New User Signup</h2>
    <p>Dear <strong>Admin</strong>,</p>
    <p>A new user has signed up on AFCON360.</p>
    <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
      <tr>
        <td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Username:</strong></td>
        <td style="padding: 8px; border-bottom: 1px solid #ddd;">{{ username }}</td>
      </tr>
      <tr>
        <td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Email:</strong></td>
        <td style="padding: 8px; border-bottom: 1px solid #ddd;">{{ email }}</td>
      </tr>
      <tr>
        <td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Signup Date:</strong></td>
        <td style="padding: 8px; border-bottom: 1px solid #ddd;">{{ signup_date }}</td>
      </tr>
      <tr>
        <td style="padding: 8px; border-bottom: 1px solid #ddd;"><strong>Role:</strong></td>
        <td style="padding: 8px; border-bottom: 1px solid #ddd;">{{ role }}</td>
      </tr>
    </table>
    <p style="color: #555; font-size: 14px;">Please review and approve the new user account.</p>
  </div>
</body>
</html>
