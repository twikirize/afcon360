{% extends "wallet/base_wallet.html" %}

{% block title %}Webhook Stats — AFCON360{% endblock %}

{% block topbar_title %}Webhook Queue Health{% endblock %}

{% block content %}
<div class="heading-row">
  <div>
    <h1 class="page-heading">Webhook Queue Health</h1>
    <p class="page-subheading">Real-time webhook queue statistics</p>
  </div>
  <a href="/admin/wallet/webhooks" class="btn btn-ghost">
    <i class="fas fa-arrow-left"></i> Back to Events
  </a>
</div>

<div class="panel">
  <div class="panel-header">
    <div class="panel-title"><i class="fas fa-chart-bar"></i> Queue Stats</div>
  </div>
  <div class="panel-body" style="padding:24px;">
    <pre id="stats-display" style="font-family:var(--font-mono);font-size:12px;background:var(--bg);padding:16px;border-radius:var(--radius);overflow-x:auto;min-height:200px;">Loading...</pre>
  </div>
</div>

<script>
async function loadStats() {
    try {
        const res = await fetch('/api/admin/wallet/webhooks/stats');
        if (!res.ok) throw new Error('Failed to load stats');
        const data = await res.json();
        document.getElementById('stats-display').textContent = JSON.stringify(data, null, 2);
    } catch (e) {
        document.getElementById('stats-display').textContent = 'Failed to load stats: ' + e.message;
    }
}

document.addEventListener('DOMContentLoaded', loadStats);
</script>
{% endblock %}
