name: Build consolidated AFCON360 User full production APK

on:
  push:
    branches:
      - feat/native-user-app-integration-20261108
    paths:
      - "mobile/apps/user/**"
      - "mobile/packages/**"
      - "mobile/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/pnpm-workspace.yaml"
      - "mobile/.npmrc"
      - ".github/workflows/user-full-apk.yml"
permissions:
  contents: read

concurrency:
  group: afcon360-user-full-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-user-production-apk:
    name: Build and verify one full User production APK
    if: >-
      ${{
        github.event_name == 'push' &&
        github.ref == 'refs/heads/feat/native-user-app-integration-20261108' &&
        contains(github.event.head_commit.message, '[build-user-apk]')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      AFCON360_PREVIEW_BUILD: "false"
      AFCON360_RELEASE_BUILD: "true"
      AFCON360_USER_EAS_PROJECT_ID: ${{ vars.AFCON360_USER_EAS_PROJECT_ID }}
      EXPO_PUBLIC_API_BASE_URL: https://www.pamoja.space
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Check out the consolidated User branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Expo SDK compatibility and User TypeScript
        run: |
          set -euo pipefail
          pnpm --filter @afcon360/user-app exec expo install --check
          pnpm user:typecheck

      - name: Validate the exact production APK configuration
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          [[ "$AFCON360_USER_EAS_PROJECT_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          pnpm --filter @afcon360/user-app exec expo config --json > "$RUNNER_TEMP/user-production-config.json"
          node - <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(
            fs.readFileSync(process.env.RUNNER_TEMP + "/user-production-config.json", "utf8")
          );
          const eas = JSON.parse(fs.readFileSync("apps/user/eas.json", "utf8"));
          const profile = eas.build?.["production-apk"];
          const expectedProjectId = process.env.AFCON360_USER_EAS_PROJECT_ID;
          const checks = {
            apkProfile: profile?.distribution === "internal" &&
              profile?.android?.buildType === "apk" &&
              profile?.channel === "production",
            remoteSigningAndVersioning: profile?.credentialsSource === "remote" &&
              profile?.autoIncrement === true &&
              profile?.environment === "production",
            package: config.android?.package === "space.pamoja.afcon360.user",
            version: config.version === "1.0.1",
            api: config.extra?.apiBaseUrl === "https://www.pamoja.space",
            updatesUrl: config.updates?.url === `https://u.expo.dev/${expectedProjectId}`,
            channel: config.updates?.requestHeaders?.["expo-channel-name"] === "production"
          };
          for (const [name, passed] of Object.entries(checks)) {
            console.log(`${passed ? "PASS" : "FAIL"} production APK config: ${name}`);
          }
          if (Object.values(checks).some((passed) => !passed)) process.exit(1);
          NODE

      - name: Set up Java for APK inspection
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK build tools
        uses: android-actions/setup-android@v3

      - name: Install Android APK inspection tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Build one remotely signed EAS APK
        id: eas-build
        working-directory: mobile/apps/user
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build \
            --platform android \
            --profile production-apk \
            --message "AFCON360 User full production APK [build-user-apk] $GITHUB_SHA" \
            --non-interactive \
            --wait \
            --json > "$RUNNER_TEMP/user-eas-build.json"

          BUILD_ID="$(node - "$RUNNER_TEMP/user-eas-build.json" <<'NODE'
          const fs = require("node:fs");
          const parsed = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const values = Array.isArray(parsed) ? parsed : [parsed];
          const build = values.find((value) => value?.id || value?.build?.id);
          const id = build?.id || build?.build?.id;
          if (!id) throw new Error("EAS did not return a build ID.");
          process.stdout.write(id);
          NODE
          )"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "EAS_BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

      - name: Retrieve the completed EAS APK artifact URL
        working-directory: mobile/apps/user
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build:view "$EAS_BUILD_ID" --json > "$RUNNER_TEMP/user-eas-build-view.json"
          node - "$RUNNER_TEMP/user-eas-build-view.json" >> "$GITHUB_ENV" <<'NODE'
          const fs = require("node:fs");
          const parsed = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const build = parsed.build || parsed;
          const url =
            build.artifacts?.buildUrl ||
            build.artifacts?.applicationArchiveUrl ||
            build.artifacts?.buildArtifactUrl;
          if (!url || !/^https:\/\//i.test(url)) {
            throw new Error("Completed EAS build has no downloadable APK artifact URL.");
          }
          process.stdout.write(`USER_APK_URL=${url}\n`);
          NODE

      - name: Download the single APK
        working-directory: mobile
        run: |
          set -euo pipefail
          mkdir -p user-apk-output
          curl --fail --location --retry 3 --retry-all-errors \
            "$USER_APK_URL" \
            --output user-apk-output/AFCON360-User-full.apk
          test -s user-apk-output/AFCON360-User-full.apk
          sha256sum user-apk-output/AFCON360-User-full.apk \
            | tee user-apk-output/AFCON360-User-full.apk.sha256

      - name: Verify APK package, version, signature and platform target
        working-directory: mobile
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK="user-apk-output/AFCON360-User-full.apk"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING" > user-apk-output/apk-badging.txt

          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode:'\\([^']*\\)'.*/\\1/p" | head -n 1)"
          MINIMUM="$(printf '%s\n' "$BADGING" | sed -n "s/.*sdkVersion:'\\([0-9]*\\)'.*/\\1/p" | head -n 1)"
          TARGET="$(printf '%s\n' "$BADGING" | sed -n "s/.*targetSdkVersion:'\\([0-9]*\\)'.*/\\1/p" | head -n 1)"

          test "$PACKAGE" = "space.pamoja.afcon360.user"
          test "$VERSION_NAME" = "1.0.1"
          test -n "$VERSION_CODE" && test "$VERSION_CODE" -ge 1
          test "$MINIMUM" = "24"
          test -n "$TARGET" && test "$TARGET" -ge 36

          "$APKSIGNER" verify --verbose --print-certs "$APK" \
            > user-apk-output/apk-signature.txt
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' user-apk-output/apk-signature.txt | head -n 1)"
          test -n "$CERT_SHA256"

          {
            echo "package=$PACKAGE"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "min_sdk=$MINIMUM"
            echo "target_sdk=$TARGET"
            echo "eas_build_id=$EAS_BUILD_ID"
            echo "signing_certificate_sha256=$CERT_SHA256"
          } | tee user-apk-output/build-info.txt

          {
            echo "## Consolidated AFCON360 User full production APK"
            echo
            echo "- EAS build ID: `$EAS_BUILD_ID`"
            echo "- Package: `$PACKAGE`"
            echo "- Version: `$VERSION_NAME` (versionCode `$VERSION_CODE`)"
            echo "- Android API: min `$MINIMUM`, target `$TARGET`"
            echo "- Signing certificate SHA-256: `$CERT_SHA256`"
            echo "- APK SHA-256: `$(sha256sum "$APK" | awk '{print $1}')`"
            echo
            echo "This is one remotely signed, installable production-package APK using the production channel. It does not submit the app to Google Play."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the single verified User APK
        uses: actions/upload-artifact@v7
        with:
          name: AFCON360-User-Full-APK
          path: |
            mobile/user-apk-output/AFCON360-User-full.apk
            mobile/user-apk-output/AFCON360-User-full.apk.sha256
            mobile/user-apk-output/build-info.txt
            mobile/user-apk-output/apk-signature.txt
            mobile/user-apk-output/apk-badging.txt
          if-no-files-found: error
          retention-days: 30
