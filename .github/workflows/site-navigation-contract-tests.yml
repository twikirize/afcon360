name: Public site navigation PostgreSQL contract tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "templates/base.html"
      - "templates/components/workspace_context_switcher.html"
      - "static/css/global/workspace-context-switcher.css"
      - "templates/public_download.html"
      - "tests/test_stage4b9_context_switch_nav_e2e.py"
      - "tests/test_public_app_download.py"
      - ".github/workflows/site-navigation-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-navigation-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site-navigation-contracts:
    name: PostgreSQL 15 — operating context and app download navigation
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: afcon360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afcon360_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: testing
      FLASK_ENV: testing
      DISABLE_REDIS: "1"
      SOCKETIO_ENABLED: "false"
      LOG_LEVEL: WARNING
      SECRET_KEY: "ci-only-not-a-production-secret"
      SECURITY_SALT: "ci-only-security-salt-value-long-enough-for-tests-2026"
      ENCRYPTION_KEY: "ci-only-not-a-production-key"
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/afcon360_test
      DATABASE_URL: postgresql://postgres@localhost:5432/afcon360_test
      TEST_DB_LOCK_TIMEOUT: "60"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-timeout==2.4.0

      - name: Confirm one Alembic head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          config = Config("migrations/alembic.ini")
          config.set_main_option("script_location", "migrations")
          heads = ScriptDirectory.from_config(config).get_heads()
          print("Alembic heads:", heads)
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head; found {len(heads)}")
          PY

      - name: Build disposable PostgreSQL test schema
        run: python -m flask --app 'app:create_app()' db upgrade

      - name: Test rendered operating-context navigation and footer-only download link
        run: |
          python -m pytest -q --timeout=120 \
            tests/test_stage4b9_context_switch_nav_e2e.py \
            tests/test_public_app_download.py
