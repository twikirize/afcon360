name: Diagnose User EAS APK build

on:
  push:
    branches:
      - fix/user-release-engineering-20261115
    paths:
      - ".github/workflows/user-eas-build-diagnostic.yml"

permissions:
  contents: read

jobs:
  inspect-failed-build:
    name: Inspect previous EAS preview APK failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      AFCON360_USER_EAS_PROJECT_ID: ${{ vars.AFCON360_USER_EAS_PROJECT_ID }}
      AFCON360_PREVIEW_BUILD: "true"
      AFCON360_RELEASE_BUILD: "false"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out release branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Read EAS failure metadata
        working-directory: mobile/apps/user
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo "::error::EXPO_TOKEN is unavailable to this diagnostic workflow."; exit 1; }
          test -n "${AFCON360_USER_EAS_PROJECT_ID:-}" || { echo "::error::AFCON360_USER_EAS_PROJECT_ID is unavailable."; exit 1; }
          npx --yes eas-cli@latest build:view "a3052852-c0be-4e37-85e1-155ce9ea1282" --json > "$RUNNER_TEMP/afcon360-user-eas-failure.json"
          node - "$RUNNER_TEMP/afcon360-user-eas-failure.json" "$RUNNER_TEMP/afcon360-user-eas-log-url.txt" <<'NODE'
          const fs = require("node:fs");
          const raw = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const build = raw.build || raw;
          const summary = {
            id: build.id,
            status: build.status,
            platform: build.platform,
            buildProfile: build.buildProfile,
            distribution: build.distribution,
            appIdentifier: build.appIdentifier,
            appVersion: build.appVersion,
            appBuildVersion: build.appBuildVersion,
            error: build.error || null,
            logFileCount: Array.isArray(build.logFiles) ? build.logFiles.length : 0,
            artifacts: {
              buildUrlAvailable: Boolean(build.artifacts?.buildUrl),
              buildArtifactsUrlAvailable: Boolean(build.artifacts?.buildArtifactsUrl)
            },
            createdAt: build.createdAt,
            completedAt: build.completedAt
          };
          console.log(JSON.stringify(summary, null, 2));
          const logUrl = Array.isArray(build.logFiles) ? build.logFiles[0] : null;
          if (logUrl && logUrl.startsWith("https://storage.googleapis.com/")) {
            fs.writeFileSync(process.argv[3], logUrl);
          }
          if (!summary.id || !summary.status) throw new Error("EAS did not return the expected build metadata.");
          NODE
          if [ -s "$RUNNER_TEMP/afcon360-user-eas-log-url.txt" ]; then
            curl --fail --location --retry 2 --retry-delay 2 "$(cat "$RUNNER_TEMP/afcon360-user-eas-log-url.txt")" --output "$RUNNER_TEMP/afcon360-user-eas-complete-hook.log"
            echo "---- EAS Build complete hook log file format ----"
            file "$RUNNER_TEMP/afcon360-user-eas-complete-hook.log"
            od -An -tx1 -N32 "$RUNNER_TEMP/afcon360-user-eas-complete-hook.log"
            python3 -m pip install --quiet brotli zstandard lz4 python-snappy
            python3 - "$RUNNER_TEMP/afcon360-user-eas-complete-hook.log" <<'PY'
          import bz2
          import gzip
          import lzma
          import pathlib
          import snappy
          import sys
          import zlib
          import brotli
          import zstandard
          import lz4.frame

          path = pathlib.Path(sys.argv[1])
          raw = path.read_bytes()
          print(f"Downloaded EAS log bytes: {len(raw)}")
          decoders = (
              ("gzip", gzip.decompress),
              ("zlib", zlib.decompress),
              ("raw-deflate", lambda value: zlib.decompress(value, -15)),
              ("bz2", bz2.decompress),
              ("lzma", lzma.decompress),
              ("brotli", brotli.decompress),
              ("zstd", zstandard.ZstdDecompressor().decompress),
              ("lz4-frame", lz4.frame.decompress),
              ("snappy", snappy.decompress),
          )
          decoded = None
          for name, decoder in decoders:
              try:
                  decoded = decoder(raw)
                  print(f"Decoded EAS log using {name}: {len(decoded)} bytes")
                  break
              except Exception as exc:
                  print(f"{name}: {type(exc).__name__}")
          if decoded is None:
              decoded = raw
              print("No available decoder matched the EAS log format.")
          text = decoded.decode("utf-8-sig", errors="replace")
          lines = text.splitlines()
          print("---- EAS Build complete hook log (last 250 lines) ----")
          print("\\n".join(lines[-250:]))
          PY
          else
            echo "::warning::EAS did not return a downloadable build log URL."
          fi
