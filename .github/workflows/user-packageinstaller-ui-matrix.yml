name: User PackageInstaller UI compatibility matrix

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feat/native-user-app-integration-20261108
    paths:
      - ".github/workflows/user-packageinstaller-ui-matrix.yml"
      - "mobile/scripts/verify-user-packageinstaller-ui.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test-apks:
    name: Build User 1.0.1 and 1.0.2 UI-install fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out User branch source
        uses: actions/checkout@v7

      - name: Download historical User 1.0.0 APK artifact
        uses: actions/download-artifact@v8
        with:
          repository: ${{ github.repository }}
          run-id: 41853965349
          github-token: ${{ github.token }}
          artifact-ids: "13338680951"
          path: old-user-artifact

      - name: Verify historical APK and source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packageinstaller-apks
          OLD_APK="old-user-artifact/user-preview.apk"
          test -s "$OLD_APK"
          cp "$OLD_APK" packageinstaller-apks/AFCON360-User-1.0.0.apk
          OLD_SHA="$(sha256sum packageinstaller-apks/AFCON360-User-1.0.0.apk | awk '\''{print $1}'\'')"
          test "$OLD_SHA" = "6b72e2fa496ff109392d8933416d287ebc981c12b025ad02a32d3651bda5b797"
          echo "Historical User 1.0.0 APK SHA-256: $OLD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Install User workspace dependencies
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile

      - name: Check User Expo dependency compatibility
        working-directory: mobile
        run: pnpm --filter "@afcon360/user-app" exec expo install --check

      - name: Validate PackageInstaller test script
        run: |
          python -m py_compile mobile/scripts/verify-user-packageinstaller-ui.py
          python mobile/scripts/verify-user-packageinstaller-ui.py --self-test

      - name: Generate OTA-enabled User preview Android project
        working-directory: mobile
        env:
          AFCON360_PREVIEW_BUILD: "true"
          AFCON360_USER_EAS_PROJECT_ID: "20708e30-4640-4b88-9615-38412f47e811"
          EXPO_PUBLIC_API_BASE_URL: "https://www.pamoja.space"
        run: pnpm --filter "@afcon360/user-app" exec expo prebuild --platform android --no-install --clean

      - name: Configure a stable signing key for the two upgrade-test APKs
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = "apps/user/android/app/build.gradle";
          let source = fs.readFileSync(path, "utf8");
          const buildTypes = source.indexOf("buildTypes {");
          const release = source.indexOf("release {", buildTypes);
          if (buildTypes < 0 || release < 0) throw new Error("Could not locate Android release build type");
          const open = source.indexOf("{", release);
          let depth = 0;
          let end = -1;
          for (let i = open; i < source.length; i++) {
            if (source[i] === "{") depth++;
            if (source[i] === "}" && --depth === 0) { end = i + 1; break; }
          }
          if (end < 0) throw new Error("Could not parse Android release build type");
          let block = source.slice(release, end);
          const signing = /signingConfig\s+signingConfigs\.[A-Za-z0-9_]+/;
          if (signing.test(block)) block = block.replace(signing, "signingConfig signingConfigs.debug");
          else block = block.replace("release {", "release {\n            signingConfig signingConfigs.debug");
          source = source.slice(0, release) + block + source.slice(end);
          fs.writeFileSync(path, source);
          NODE

      - name: Build current User 1.0.1 APK
        working-directory: mobile/apps/user/android
        env:
          AFCON360_PREVIEW_BUILD: "true"
          AFCON360_USER_EAS_PROJECT_ID: "20708e30-4640-4b88-9615-38412f47e811"
          EXPO_PUBLIC_API_BASE_URL: "https://www.pamoja.space"
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Stage and verify current 1.0.1 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find mobile/apps/user/android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          cp "$APK" packageinstaller-apks/AFCON360-User-1.0.1.apk
          BADGING="$(aapt dump badging packageinstaller-apks/AFCON360-User-1.0.1.apk)"
          printf '%s\n' "$BADGING" | grep -F "package: name='space.pamoja.afcon360.user.preview'"
          printf '%s\n' "$BADGING" | grep -F "versionName='1.0.1'"
          SHA="$(sha256sum packageinstaller-apks/AFCON360-User-1.0.1.apk | awk '{print $1}')"
          echo "Current User 1.0.1 APK SHA-256: $SHA"

      - name: Increment version code and build signed 1.0.2 upgrade APK
        working-directory: mobile
        shell: bash
        env:
          AFCON360_PREVIEW_BUILD: "true"
          AFCON360_USER_EAS_PROJECT_ID: "20708e30-4640-4b88-9615-38412f47e811"
          EXPO_PUBLIC_API_BASE_URL: "https://www.pamoja.space"
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = "apps/user/android/app/build.gradle";
          let source = fs.readFileSync(path, "utf8");
          const start = source.indexOf("defaultConfig {");
          if (start < 0) throw new Error("Android defaultConfig block not found");
          const open = source.indexOf("{", start);
          let depth = 0;
          let end = -1;
          for (let i = open; i < source.length; i++) {
            if (source[i] === "{") depth++;
            if (source[i] === "}" && --depth === 0) { end = i + 1; break; }
          }
          if (end < 0) throw new Error("Could not parse Android defaultConfig block");
          let block = source.slice(start, end);
          if (!/versionCode\s+1\b/.test(block)) throw new Error("Expected generated versionCode 1 before upgrade fixture build");
          if (!/versionName\s+["']1\.0\.1["']/.test(block)) throw new Error("Expected generated versionName 1.0.1 before upgrade fixture build");
          block = block.replace(/versionCode\s+1\b/, "versionCode 2");
          block = block.replace(/versionName\s+["']1\.0\.1["']/, 'versionName "1.0.2"');
          source = source.slice(0, start) + block + source.slice(end);
          fs.writeFileSync(path, source);
          NODE
          cd apps/user/android
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify same signing certificate and stage 1.0.2 APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find mobile/apps/user/android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          cp "$APK" packageinstaller-apks/AFCON360-User-1.0.2.apk
          for f in packageinstaller-apks/AFCON360-User-1.0.1.apk packageinstaller-apks/AFCON360-User-1.0.2.apk; do
            aapt dump badging "$f" | grep -F "package: name='space.pamoja.afcon360.user.preview'"
          done
          apksigner verify --print-certs packageinstaller-apks/AFCON360-User-1.0.1.apk > packageinstaller-apks/signer-1.0.1.txt
          apksigner verify --print-certs packageinstaller-apks/AFCON360-User-1.0.2.apk > packageinstaller-apks/signer-1.0.2.txt
          CERT1="$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' packageinstaller-apks/signer-1.0.1.txt | head -n 1)"
          CERT2="$(sed -n 's/Signer #1 certificate SHA-256 digest: //p' packageinstaller-apks/signer-1.0.2.txt | head -n 1)"
          test -n "$CERT1" && test "$CERT1" = "$CERT2"
          echo "Verified 1.0.1 -> 1.0.2 upgrade fixtures share signer $CERT1."
          (cd packageinstaller-apks && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload historical and current User APK fixtures
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-user-packageinstaller-ui-test-apks
          path: packageinstaller-apks/
          if-no-files-found: error
          retention-days: 30

  packageinstaller-ui-matrix:
    name: PackageInstaller UI — Android ${{ matrix.android-label }}
    needs: build-test-apks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - android-label: "13 / API 33"
            api-level: "33"
            system-image-api-level: "33"
            target: google_apis
          - android-label: "14 / API 34"
            api-level: "34"
            system-image-api-level: "34"
            target: google_apis
          - android-label: "15 / API 35"
            api-level: "35"
            system-image-api-level: "35"
            target: google_apis
          - android-label: "16 / API 36"
            api-level: "36"
            system-image-api-level: "36"
            target: google_apis
          - android-label: "17 / API 37"
            api-level: "37.0"
            system-image-api-level: "37.0"
            target: default

    steps:
      - name: Check out User test harness
        uses: actions/checkout@v7

      - name: Download verified User APK fixtures
        uses: actions/download-artifact@v8
        with:
          name: afcon360-user-packageinstaller-ui-test-apks
          path: packageinstaller-apks

      - name: Verify fixture checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd packageinstaller-apks && sha256sum -c SHA256SUMS.txt)

      - name: Verify emulator infrastructure readiness
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking ADB device state..."
          adb wait-for-device
          STATE=$(adb get-state)
          test "$STATE" = "device"
          echo "ADB device state: $STATE"

          echo "Checking boot completion..."
          for i in {1..60}; do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1"
          echo "Boot completed"

          echo "Checking PackageManager..."
          for i in {1..60}; do
            if adb shell pm list packages 2>/dev/null | grep -q "package:"; then break; fi
            sleep 2
          done
          adb shell pm list packages 2>/dev/null | grep -q "package:"
          echo "PackageManager responsive"

          echo "Checking MediaProvider..."
          if ! adb shell pm list packages 2>/dev/null | grep -q "com.android.providers.media"; then
            echo "::error::MediaProvider not installed"
            exit 1
          fi
          echo "MediaProvider present"

          echo "All infrastructure checks passed"

      - name: Run real Android PackageInstaller UI tests
        if: steps.infra.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          system-image-api-level: ${{ matrix.system-image-api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          emulator-boot-timeout: 600
          script: >-
            python mobile/scripts/verify-user-packageinstaller-ui.py
            --expected-api ${{ matrix.api-level == '37.0' && '37' || matrix.api-level }}
            --old-apk packageinstaller-apks/AFCON360-User-1.0.0.apk
            --current-apk packageinstaller-apks/AFCON360-User-1.0.1.apk
            --upgrade-apk packageinstaller-apks/AFCON360-User-1.0.2.apk
            --evidence-dir packageinstaller-ui-evidence

      - name: Upload PackageInstaller UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-user-packageinstaller-ui-${{ matrix.android-label }}
          path: packageinstaller-ui-evidence/
          if-no-files-found: warn
          retention-days: 30
