name: Timezone model contract

on:
  push:
    branches:
      - work/global-timezone-standard-20261025
    paths:
      - "app/**"
      - "app.py"
      - "migrations/versions/tza20261025_global_timezone_aware_timestamps.py"
      - "scripts/audit_naive_timestamp_columns.py"
      - "scripts/audit_timezone_migration_lineage.py"
      - "docs/architecture/TIMESTAMP_SEMANTICS_REGISTER.md"
      - "tests/test_timezone_migration_policy_standalone.py"
      - "tests/test_timezone_logging_contract_standalone.py"
      - "tests/test_timezone_model_contract.py"
      - "tests/test_timezone_primitives_standalone.py"
      - "tests/test_console_timezone_contract_standalone.py"
      - "tests/test_timezone_runtime_contract_standalone.py"
      - ".github/workflows/timezone-contract-tests.yml"
  pull_request:
    paths:
      - "app/**"
      - "app.py"
      - "migrations/versions/tza20261025_global_timezone_aware_timestamps.py"
      - "scripts/audit_naive_timestamp_columns.py"
      - "scripts/audit_timezone_migration_lineage.py"
      - "docs/architecture/TIMESTAMP_SEMANTICS_REGISTER.md"
      - "tests/test_timezone_migration_policy_standalone.py"
      - "tests/test_timezone_logging_contract_standalone.py"
      - "tests/test_timezone_model_contract.py"
      - "tests/test_timezone_primitives_standalone.py"
      - "tests/test_console_timezone_contract_standalone.py"
      - "tests/test_timezone_runtime_contract_standalone.py"
      - ".github/workflows/timezone-contract-tests.yml"

permissions:
  contents: read

jobs:
  static-contract:
    name: Naive model-column audit (no database access)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check "pytest>=9,<10"
      - name: Enforce timezone-aware SQLAlchemy DateTime declarations
        run: python -m pytest --noconftest -q tests/test_timezone_model_contract.py tests/test_timezone_primitives_standalone.py tests/test_console_timezone_contract_standalone.py tests/test_timezone_runtime_contract_standalone.py tests/test_timezone_migration_policy_standalone.py tests/test_timezone_logging_contract_standalone.py
      - name: Compile timezone and runtime boundary modules
        run: >-
          python -m py_compile
          app/utils/time.py
          app/geo/history.py
          app/geo/activity.py
          app/geo/validation.py
          app/geo/realtime.py
          app/production_console/streaming.py
          migrations/versions/tza20261025_global_timezone_aware_timestamps.py
          scripts/audit_naive_timestamp_columns.py
          scripts/audit_timezone_migration_lineage.py
          app.py
          app/notifications/events/stream_consumer.py
          tests/test_timezone_model_contract.py
          tests/test_timezone_primitives_standalone.py
          tests/test_console_timezone_contract_standalone.py
          tests/test_timezone_runtime_contract_standalone.py
          tests/test_timezone_migration_policy_standalone.py
          tests/test_timezone_logging_contract_standalone.py
          tests/test_geo_history.py
          tests/test_geo_activity.py
          tests/test_geo_realtime.py
