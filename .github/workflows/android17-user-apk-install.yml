name: AFCON360 User APK install check — Android 17

on:
  push:
    branches:
      - feat/native-user-app-integration-20261108
    paths:
      - ".github/workflows/android17-user-apk-install.yml"

permissions:
  actions: read
  contents: read

jobs:
  install-user-apk:
    name: Install the exact cached User APK on Android 17 (API 37)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the User app source
        uses: actions/checkout@v7

      - name: Restore the exact source-keyed APK from the successful E2E build
        id: user-apk-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile-e2e-cache/
          key: afcon360-user-e2e-apk-v2-${{ hashFiles('mobile/apps/user/**', 'mobile/packages/**', 'mobile/package.json', 'mobile/pnpm-lock.yaml', 'mobile/pnpm-workspace.yaml', 'mobile/.npmrc', '.github/workflows/mobile-workspace.yml') }}

      - name: Verify this is the exact APK already tested on Android 16
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.user-apk-cache.outputs.cache-hit }}" != "true" ]; then
            echo "::error::The exact cached APK was not found. Refusing to build a substitute APK."
            exit 1
          fi
          APK="mobile-e2e-cache/user-e2e.apk"
          INFO="mobile-e2e-cache/build-info.txt"
          test -s "$APK"
          test -s "$INFO"
          grep -Fxq "app=user" "$INFO"
          grep -Fxq "package=space.pamoja.afcon360.user.preview" "$INFO"
          grep -Fxq "source_commit=3b03c0688c84c1e7f341c4e3a5401152cc46d462" "$INFO"
          EXPECTED_SHA="cf433a4bcfcab43f877781c1f349f139cb3fb0c366f0b45e19603981f4d648df"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact APK verified: $ACTUAL_SHA"
          cat "$INFO"

      - name: Enable hardware acceleration for Android 17 emulator
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install and launch the User APK on Android 17
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on -memory 4096
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            mkdir -p android17-install-evidence
            APK="mobile-e2e-cache/user-e2e.apk"
            API="$(adb shell getprop ro.build.version.sdk | tr -d '\r')"
            RELEASE="$(adb shell getprop ro.build.version.release | tr -d '\r')"
            echo "Emulator Android release=$RELEASE api=$API"
            test "$API" = "37"
            adb install -r "$APK" | tee android17-install-evidence/adb-install.txt
            adb shell pm path space.pamoja.afcon360.user.preview | tee android17-install-evidence/package-path.txt
            adb shell monkey -p space.pamoja.afcon360.user.preview -c android.intent.category.LAUNCHER 1 | tee android17-install-evidence/launch.txt
            sleep 8
            adb logcat -d -t 2500 > android17-install-evidence/logcat.txt
            echo "PASS: exact AFCON360 User APK installed on Android $RELEASE (API $API)."
          working-directory: .

      - name: Upload Android 17 install evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-user-android17-install-evidence
          path: android17-install-evidence/
          if-no-files-found: warn
          retention-days: 30
