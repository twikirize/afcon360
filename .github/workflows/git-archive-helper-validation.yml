name: Git archive helper validation

on:
  pull_request:
    paths:
      - "scripts/git/afcon360-git-archive.ps1"
      - "docs/git/AFCON360_GIT_ARCHIVE_AND_RECOVERY.md"
      - ".github/workflows/git-archive-helper-validation.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/git/afcon360-git-archive.ps1"
      - "docs/git/AFCON360_GIT_ARCHIVE_AND_RECOVERY.md"
      - ".github/workflows/git-archive-helper-validation.yml"

permissions:
  contents: read

jobs:
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Parse archive and recovery helper
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = "scripts/git/afcon360-git-archive.ps1"
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$parseErrors
          )

          if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List *
              exit 1
          }

          Write-Host "PowerShell syntax is valid: $path"

      - name: Smoke-test Windows PowerShell 5.1 native stderr handling and inventory
        shell: powershell
        run: |
          # Simulate the benign stderr progress text Git emits after fetching
          # updated refs. The helper must capture it without treating it as a
          # fatal PowerShell error, then decide success from Git's exit code.
          $global:AFCON360_REAL_GIT = (Get-Command git.exe -ErrorAction Stop).Source
          function global:git {
              if ($args.Count -gt 0 -and $args[0] -eq "fetch") {
                  Write-Error "From https://example.invalid/twikirize/afcon360"
              }
              & $global:AFCON360_REAL_GIT @args
              $global:LASTEXITCODE = $LASTEXITCODE
          }

          & ./scripts/git/afcon360-git-archive.ps1 -Action List
          if ($LASTEXITCODE -ne 0) {
              throw "The read-only inventory action failed."
          }
