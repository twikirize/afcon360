name: Mobile workspace CI

on:
  push:
    branches:
      - feat/native-user-app-integration-20261108
      - fix/native-user-apk-cache-and-e2e-20261110
    paths:
      - "mobile/apps/user/**"
      - "mobile/packages/**"
      - "mobile/scripts/**"
      - "mobile/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/pnpm-workspace.yaml"
      - "mobile/.npmrc"
      - ".github/workflows/mobile-workspace.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [feat/native-user-app-integration-20261108]
    paths:
      - "mobile/apps/user/**"
      - "mobile/packages/**"
      - "mobile/scripts/**"
      - "mobile/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/pnpm-workspace.yaml"
      - "mobile/.npmrc"
      - ".github/workflows/mobile-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AFCON360_USER_EAS_PROJECT_ID: ${{ vars.AFCON360_USER_EAS_PROJECT_ID }}

jobs:
  mobile-typecheck:
    name: Expo dependency and TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check approved website handoffs and native account deletion
        run: pnpm navigation:check

      - name: Check User app Expo SDK dependency compatibility
        run: pnpm --filter @afcon360/user-app exec expo install --check

      - name: Type-check User application
        run: pnpm user:typecheck

      - name: Bundle User app for Android and iOS
        run: |
          pnpm --filter @afcon360/user-app exec expo export --platform android --output-dir /tmp/afcon360-user-android
          pnpm --filter @afcon360/user-app exec expo export --platform ios --output-dir /tmp/afcon360-user-ios

  user-authenticated-journey:
    name: User APK — login, protected journeys, restore and logout
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      apk_ready: ${{ steps.stage_user_apk.outputs.ready }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afcon360_mobile_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afcon360_mobile_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: local
      FLASK_ENV: testing
      SECRET_KEY: "ci-only-not-a-production-secret"
      SECURITY_SALT: "ci-only-security-salt-value-long-enough-for-tests-2026"
      ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      REFUND_POLICY_SIGNING_KEY: "ci-only-refund-policy-signing-key-not-production"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afcon360_mobile_e2e_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afcon360_mobile_e2e_test
      REDIS_URL: redis://localhost:6379/15
      DISABLE_REDIS: "0"
      SOCKETIO_ENABLED: "false"
      ANALYTICS_ENABLED: "false"
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
      MAIL_SUPPRESS_SEND: "true"
      AFCON360_E2E_BACKEND_ROOT: ${{ github.workspace }}/backend-main
      AFCON360_E2E_USERNAME: native_e2e_user
      AFCON360_E2E_EMAIL: native-e2e@afcon360.test
      AFCON360_E2E_PASSWORD: NativeE2ePassword2026
      AFCON360_E2E_EVIDENCE_DIR: mobile-e2e-evidence
      AFCON360_E2E_REQUEST_LOG: mobile-e2e-evidence/backend-requests.tsv
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check out backend main for the test API
        uses: actions/checkout@v7
        with:
          ref: main
          path: backend-main

      - name: Record backend main revision
        working-directory: backend-main
        run: |
          echo "Backend test source: $(git rev-parse HEAD)"
          echo "Backend branch: $(git branch --show-current)"

      - name: Prepare User APK cache directory
        run: mkdir -p mobile-e2e-cache
      - name: Calculate User APK cache key before prebuild
        id: user-apk-key
        env:
          USER_APK_SOURCE_KEY: afcon360-user-e2e-apk-v2-${{ hashFiles('mobile/apps/user/**', 'mobile/packages/**', 'mobile/package.json', 'mobile/pnpm-lock.yaml', 'mobile/pnpm-workspace.yaml', 'mobile/.npmrc', '.github/workflows/mobile-workspace.yml') }}
        run: echo "key=$USER_APK_SOURCE_KEY" >> "$GITHUB_OUTPUT"
      - name: Restore source-keyed User E2E APK
        id: user-apk-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile-e2e-cache/
          key: ${{ steps.user-apk-key.outputs.key }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend-main/requirements.txt
      - name: Install Flask backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend-main/requirements.txt
      - name: Build a fresh disposable PostgreSQL schema from backend main
        working-directory: backend-main
        run: python -m flask --app 'app:create_app()' db upgrade

      - name: Ensure current SystemConfig model exists in disposable E2E schema
        working-directory: backend-main
        run: |
          python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.models.system_config import SystemConfig

          app = create_app()
          with app.app_context():
              existed = db.inspect(db.engine).has_table(SystemConfig.__tablename__)
              SystemConfig.__table__.create(bind=db.engine, checkfirst=True)
              created = SystemConfig.initialize_defaults()
              print(
                  "E2E SystemConfig schema ready: "
                  f"table_preexisting={existed}, defaults_created={created}"
              )
          PY

      - name: Seed one synthetic, non-MFA AFCON360 User
        run: python mobile/scripts/mobile-user-e2e-backend.py seed
      - name: Start isolated Flask API and wait for health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-e2e-evidence
          nohup python mobile/scripts/mobile-user-e2e-backend.py serve > mobile-e2e-evidence/backend.log 2>&1 < /dev/null &
          echo $! > mobile-e2e-evidence/backend.pid
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:5000/api/health/ping >/dev/null; then
              echo "Disposable AFCON360 API is healthy."
              exit 0
            fi
            sleep 2
          done
          cat mobile-e2e-evidence/backend.log
          echo "::error::Disposable AFCON360 API did not become healthy."
          exit 1
      - name: Set up Node.js
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
      - name: Set up pnpm
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false
      - name: Set up Java
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install User app workspace dependencies
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile
      - name: Check User app Expo dependency compatibility
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        working-directory: mobile
        run: pnpm --filter "@afcon360/user-app" exec expo install --check
      - name: Install Android platform and build tools
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
      - name: Generate a fresh User APK pointing only to the disposable local API
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        working-directory: mobile
        env:
          AFCON360_PREVIEW_BUILD: "true"
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
        run: pnpm --filter "@afcon360/user-app" exec expo prebuild --platform android --no-install --clean
      - name: Allow private-network HTTP only in this disposable preview APK
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          manifest = Path("mobile/apps/user/android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          if not re.search(r"\bxmlns:android\s*=", source[:2000]):
              raise SystemExit("Generated Android manifest is missing its android namespace declaration.")
          app_tag = re.search(r"<application\b[^>]*>", source, flags=re.DOTALL)
          if app_tag is None:
              raise SystemExit("Generated Android manifest has no application element.")
          opening = app_tag.group(0)
          if re.search(r"\bandroid:usesCleartextTraffic\s*=", opening):
              opening = re.sub(
                  r"\bandroid:usesCleartextTraffic\s*=\s*[\"'][^\"']*[\"']",
                  'android:usesCleartextTraffic="true"',
                  opening,
              )
          else:
              opening = opening[:-1] + ' android:usesCleartextTraffic="true">'
          source = source[:app_tag.start()] + opening + source[app_tag.end():]
          ET.fromstring(source)
          manifest.write_text(source, encoding="utf-8")
          print("HTTP enabled only in this disposable preview APK; runtime API validation restricts selected HTTP servers to loopback or private IPv4.")
          PY
      - name: Configure ephemeral release signing
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "apps/user/android/app/build.gradle";
          let source = fs.readFileSync(path, "utf8");
          const buildTypes = source.indexOf("buildTypes {");
          const release = source.indexOf("release {", buildTypes);
          if (buildTypes < 0 || release < 0) throw new Error("Could not find Android release build type");
          const open = source.indexOf("{", release);
          let depth = 0;
          let end = -1;
          for (let i = open; i < source.length; i++) {
            if (source[i] === "{") depth++;
            if (source[i] === "}") {
              depth--;
              if (depth === 0) { end = i + 1; break; }
            }
          }
          if (end < 0) throw new Error("Could not find end of Android release build type");
          let block = source.slice(release, end);
          const signing = /signingConfig\s+signingConfigs\.[A-Za-z0-9_]+/;
          if (signing.test(block)) block = block.replace(signing, "signingConfig signingConfigs.debug");
          else block = block.replace("release {", "release {\n            signingConfig signingConfigs.debug");
          source = source.slice(0, release) + block + source.slice(end);
          fs.writeFileSync(path, source);
          NODE
      - name: Build isolated User release APK
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        working-directory: mobile/apps/user/android
        env:
          # Re-evaluate the dynamic Expo config during Metro/Gradle bundling too,
          # so the embedded manifest retains preview-only server selection.
          AFCON360_PREVIEW_BUILD: "true"
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Save fresh APK under the source-keyed cache key
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        shell: bash
        env:
          USER_APK_CACHE_KEY: ${{ steps.user-apk-key.outputs.key }}
        run: |
          set -euo pipefail
          APK="$(find mobile/apps/user/android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          mkdir -p mobile-e2e-cache
          cp "$APK" mobile-e2e-cache/user-e2e.apk
          APK_SHA256="$(sha256sum mobile-e2e-cache/user-e2e.apk | awk '{print $1}')"
          BADGING="$(aapt dump badging mobile-e2e-cache/user-e2e.apk)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          MINIMUM="$(printf '%s\n' "$BADGING" | sed -n "s/.*sdkVersion:'\\([0-9]*\\)'.*/\\1/p" | head -n 1)"
          TARGET="$(printf '%s\n' "$BADGING" | sed -n "s/.*targetSdkVersion:'\\([0-9]*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE" = "space.pamoja.afcon360.user.preview"
          test "$MINIMUM" = "24"
          test -n "$TARGET" && test "$TARGET" -ge 36
          echo "Verified APK package=$PACKAGE minSdkVersion=$MINIMUM targetSdkVersion=$TARGET"
          cat > mobile-e2e-cache/build-info.txt <<EOF
          app=user
          package=$PACKAGE
          min_sdk=$MINIMUM
          target_sdk=$TARGET
          api_origin=http://127.0.0.1:5000
          source_commit=$GITHUB_SHA
          cache_key=$USER_APK_CACHE_KEY
          apk_sha256=$APK_SHA256
          EOF
      - name: Persist fresh User APK immediately
        if: steps.user-apk-cache.outputs['cache-hit'] != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile-e2e-cache/
          key: ${{ steps.user-apk-key.outputs.key }}
      - name: Stage and verify cached User APK for this journey
        id: stage_user_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile-e2e-cache/user-e2e.apk"
          INFO="mobile-e2e-cache/build-info.txt"
          test -s "$APK"
          test -s "$INFO"
          EXPECTED_SHA="$(sed -n 's/^apk_sha256=//p' "$INFO" | head -n 1)"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          mkdir -p mobile-e2e-evidence
          cp "$APK" mobile-e2e-evidence/user-e2e.apk
          cp "$INFO" mobile-e2e-evidence/user-e2e-build-info.txt
          printf '%s  %s\n' "$ACTUAL_SHA" "user-e2e.apk" | tee mobile-e2e-evidence/user-e2e-apk.sha256
          echo "Verified reusable User APK (cache_hit=${{ steps.user-apk-cache.outputs['cache-hit'] }}): $ACTUAL_SHA"
          cat mobile-e2e-evidence/user-e2e-build-info.txt
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Upload verified APK for independent Android compatibility matrix
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-user-platform-test-apk
          path: |
            mobile-e2e-evidence/user-e2e.apk
            mobile-e2e-evidence/user-e2e-apk.sha256
            mobile-e2e-evidence/user-e2e-build-info.txt
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; hardware acceleration is unavailable."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install, authenticate, test services, restore session and sign out
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          disable-linux-hw-accel: false
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          emulator-boot-timeout: 600
          script: python mobile/scripts/verify-user-authenticated-journey.py
      - name: Verify server-side logout and protected API evidence
        if: always()
        run: python mobile/scripts/mobile-user-e2e-backend.py assert
      - name: Upload User Android journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-user-android-e2e-evidence
          path: mobile-e2e-evidence/
          if-no-files-found: warn
          retention-days: 90

  user-android-version-compatibility:
    name: User authenticated journey — ${{ matrix.android-label }}
    needs: user-authenticated-journey
    if: ${{ always() && needs.user-authenticated-journey.outputs.apk_ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afcon360_mobile_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afcon360_mobile_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: local
      FLASK_ENV: testing
      SECRET_KEY: "ci-only-not-a-production-secret"
      SECURITY_SALT: "ci-only-security-salt-value-long-enough-for-tests-2026"
      ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      REFUND_POLICY_SIGNING_KEY: "ci-only-refund-policy-signing-key-not-production"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afcon360_mobile_e2e_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afcon360_mobile_e2e_test
      REDIS_URL: redis://localhost:6379/15
      DISABLE_REDIS: "0"
      SOCKETIO_ENABLED: "false"
      ANALYTICS_ENABLED: "false"
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
      MAIL_SUPPRESS_SEND: "true"
      AFCON360_E2E_BACKEND_ROOT: ${{ github.workspace }}/backend-main
      AFCON360_E2E_USERNAME: native_e2e_user
      AFCON360_E2E_EMAIL: native-e2e@afcon360.test
      AFCON360_E2E_PASSWORD: NativeE2ePassword2026
      AFCON360_E2E_EVIDENCE_DIR: android-compat-evidence/${{ matrix.android-label }}
      AFCON360_E2E_REQUEST_LOG: android-compat-evidence/${{ matrix.android-label }}/backend-requests.tsv
      AFCON360_USER_E2E_APK: mobile-e2e-artifact/user-e2e.apk
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - android-label: android-7.0
            api-level: '24'
            system-image-api-level: '24'
            expected-api: '24'
          - android-label: android-7.1
            api-level: '25'
            system-image-api-level: '25'
            expected-api: '25'
          - android-label: android-8.0
            api-level: '26'
            system-image-api-level: '26'
            expected-api: '26'
          - android-label: android-8.1
            api-level: '27'
            system-image-api-level: '27'
            target: default
            expected-api: '27'
          - android-label: android-9
            api-level: '28'
            system-image-api-level: '28'
            expected-api: '28'
          - android-label: android-10
            api-level: '29'
            system-image-api-level: '29'
            expected-api: '29'
          - android-label: android-11
            api-level: '30'
            system-image-api-level: '30'
            expected-api: '30'
          - android-label: android-12
            api-level: '31'
            system-image-api-level: '31'
            expected-api: '31'
          - android-label: android-12l
            api-level: '32'
            system-image-api-level: '32'
            expected-api: '32'
          - android-label: android-13
            api-level: '33'
            system-image-api-level: '33'
            expected-api: '33'
          - android-label: android-14
            api-level: '34'
            system-image-api-level: '34'
            expected-api: '34'
          - android-label: android-15
            api-level: '35'
            system-image-api-level: '35'
            expected-api: '35'
          - android-label: android-16
            api-level: '36'
            system-image-api-level: '36'
            expected-api: '36'
          - android-label: android-17
            api-level: '37.0'
            system-image-api-level: '37.0'
            target: default
            expected-api: '37'
    steps:
      - name: Check out User app and backend verification source
        uses: actions/checkout@v7

      - name: Check out backend main for the compatibility API
        uses: actions/checkout@v7
        with:
          ref: main
          path: backend-main

      - name: Record backend main revision
        working-directory: backend-main
        run: |
          echo "Backend test source: $(git rev-parse HEAD)"
          echo "Backend branch: $(git branch --show-current)"

      - name: Download the exact APK staged by the primary User journey
        uses: actions/download-artifact@v8
        with:
          name: afcon360-user-platform-test-apk
          path: mobile-e2e-artifact

      - name: Verify exact APK provenance and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s "$AFCON360_USER_E2E_APK"
          test -s mobile-e2e-artifact/user-e2e-apk.sha256
          test -s mobile-e2e-artifact/user-e2e-build-info.txt
          grep -Fxq "app=user" mobile-e2e-artifact/user-e2e-build-info.txt
          grep -Fxq "package=space.pamoja.afcon360.user.preview" mobile-e2e-artifact/user-e2e-build-info.txt
          EXPECTED_SHA="$(awk 'NR == 1 { print $1 }' mobile-e2e-artifact/user-e2e-apk.sha256)"
          ACTUAL_SHA="$(sha256sum "$AFCON360_USER_E2E_APK" | awk '{ print $1 }')"
          test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          echo "Verified the same source APK ($ACTUAL_SHA) for ${{ matrix.android-label }}."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend-main/requirements.txt

      - name: Install isolated Flask backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend-main/requirements.txt

      - name: Build a fresh isolated PostgreSQL schema from backend main
        working-directory: backend-main
        run: python -m flask --app 'app:create_app()' db upgrade

      - name: Ensure current SystemConfig model exists in disposable E2E schema
        working-directory: backend-main
        run: |
          python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.models.system_config import SystemConfig

          app = create_app()
          with app.app_context():
              existed = db.inspect(db.engine).has_table(SystemConfig.__tablename__)
              SystemConfig.__table__.create(bind=db.engine, checkfirst=True)
              created = SystemConfig.initialize_defaults()
              print(
                  "E2E SystemConfig schema ready: "
                  f"table_preexisting={existed}, defaults_created={created}"
              )
          PY

      - name: Seed one synthetic, non-MFA User for this Android version
        run: python mobile/scripts/mobile-user-e2e-backend.py seed

      - name: Start this version's isolated Flask API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AFCON360_E2E_EVIDENCE_DIR"
          nohup python mobile/scripts/mobile-user-e2e-backend.py serve \
            > "$AFCON360_E2E_EVIDENCE_DIR/backend.log" 2>&1 < /dev/null &
          echo $! > "$AFCON360_E2E_EVIDENCE_DIR/backend.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:5000/api/health/ping >/dev/null; then
              echo "Isolated API is healthy for ${{ matrix.android-label }}."
              exit 0
            fi
            sleep 2
          done
          cat "$AFCON360_E2E_EVIDENCE_DIR/backend.log"
          echo "::error::The isolated API did not become healthy."
          exit 1

      - name: Repair Android SDK command-line tools and validate Android 17 AVD metadata
        if: matrix.android-label == 'android-17'
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CLT="$SDK/cmdline-tools/latest"
          test -x "$CLT/bin/sdkmanager"

          CURRENT_VERSION="$("$CLT/bin/sdkmanager" --version | tail -n 1)"
          echo "Preinstalled Android command-line tools: $CURRENT_VERSION"
          if [ "$CURRENT_VERSION" != "22.0" ]; then
            rm -rf "$SDK/cmdline-tools/latest-2"
            # sdkmanager cannot overwrite its own preinstalled 'latest' folder.
            # It installs the replacement beside it; move that replacement into
            # the canonical path before android-emulator-runner invokes avdmanager.
            set +o pipefail
            yes | "$CLT/bin/sdkmanager" --install "cmdline-tools;latest" >/dev/null
            set -o pipefail
            if [ -d "$SDK/cmdline-tools/latest-2" ]; then
              rm -rf "$CLT"
              mv "$SDK/cmdline-tools/latest-2" "$CLT"
            fi
          fi

          FINAL_VERSION="$("$CLT/bin/sdkmanager" --version | tail -n 1)"
          echo "Android command-line tools after update: $FINAL_VERSION"
          python3 - "$FINAL_VERSION" <<'PY'
          import sys
          version = tuple(int(part) for part in sys.argv[1].split(".")[:2])
          if version < (20, 0):
              raise SystemExit(
                  f"Android command-line tools {sys.argv[1]} cannot parse "
                  "Major.Minor platform versions such as android-37.0."
              )
          PY

          echo "$CLT/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          # Reproduce the exact Major.Minor package parsing used by the
          # Android 17 emulator action and fail before launching a broken AVD.
          IMAGE="system-images;android-37.0;default;x86_64"
          "$CLT/bin/sdkmanager" --install "$IMAGE" >/dev/null
          AVD_HOME="${ANDROID_AVD_HOME:-$HOME/.android/avd}"
          AVD_NAME="afcon360-api37-tools-check"
          mkdir -p "$AVD_HOME"
          "$CLT/bin/avdmanager" delete avd -n "$AVD_NAME" >/dev/null 2>&1 || true
          echo no | "$CLT/bin/avdmanager" create avd --force -n "$AVD_NAME" --package "$IMAGE" --device pixel_7
          AVD_INI="$AVD_HOME/$AVD_NAME.ini"
          test -s "$AVD_INI"
          if ! grep -Fxq "target=android-37.0" "$AVD_INI"; then
            echo "::error::Android 17 AVD metadata is invalid; expected target=android-37.0."
            cat "$AVD_INI"
            exit 1
          fi
          echo "ANDROID_17_AVD_METADATA_PASS: $(grep '^target=' "$AVD_INI")"
          "$CLT/bin/avdmanager" delete avd -n "$AVD_NAME" >/dev/null

      - name: Enable hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run the complete User journey on ${{ matrix.android-label }}
        id: android_journey
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          system-image-api-level: ${{ matrix.system-image-api-level }}
          target: ${{ matrix.target || 'google_apis' }}
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 12G
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          emulator-boot-timeout: 900
          script: python mobile/scripts/verify-user-authenticated-journey.py

      - name: Verify protected APIs and server-side logout for this Android version
        if: ${{ steps.android_journey.outcome == 'success' }}
        run: python mobile/scripts/mobile-user-e2e-backend.py assert

      - name: Upload full Android journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-user-${{ matrix.android-label }}-journey-evidence
          path: android-compat-evidence/${{ matrix.android-label }}/
          if-no-files-found: warn
          retention-days: 30
