name: Mobile workspace CI

on:
  push:
    branches:
      - feat/native-user-app-integration-20261108
      - fix/native-user-apk-cache-and-e2e-20261110
      - fix/user-release-engineering-20261115
      - feat/user-offline-first-foundation-20261117
    paths:
      - "mobile/apps/user/**"
      - "mobile/packages/**"
      - "mobile/scripts/**"
      - "mobile/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/pnpm-workspace.yaml"
      - "mobile/.npmrc"
      - ".github/workflows/mobile-workspace.yml"
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [feat/native-user-app-integration-20261108]
    paths:
      - "mobile/apps/user/**"
      - "mobile/packages/**"
      - "mobile/scripts/**"
      - "mobile/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/pnpm-workspace.yaml"
      - "mobile/.npmrc"
      - ".github/workflows/mobile-workspace.yml"
  workflow_dispatch:
    inputs:
      force_apk_rebuild:
        description: Force a fresh disposable User APK build and authenticated Android test.
        type: boolean
        required: false
        default: false
      publish_preview_ota:
        description: Manually publish a validated OTA-compatible User change to the preview channel.
        type: boolean
        required: false
        default: false

concurrency:
  group: afcon360-user-mobile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  AFCON360_USER_EAS_PROJECT_ID: ${{ vars.AFCON360_USER_EAS_PROJECT_ID }}
  AFCON360_USER_E2E_APK_RECIPE_VERSION: "v3"

jobs:
  classify-user-changes:
    name: Classify User changes — OTA or native rebuild
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.classify.outputs.native }}
      ota: ${{ steps.classify.outputs.ota }}
      e2e_harness: ${{ steps.classify.outputs.e2e_harness }}
    steps:
      - name: Check out full history for reliable change detection
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed User files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import PurePosixPath

          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          base = os.environ.get("BASE_SHA", "").strip()
          default_branch = os.environ.get("DEFAULT_BRANCH", "main").strip() or "main"
          if not base or set(base) == {"0"}:
              subprocess.run(["git", "fetch", "origin", default_branch], check=True)
              base = git("merge-base", "HEAD", f"origin/{default_branch}")

          if subprocess.run(
              ["git", "cat-file", "-e", f"{base}^{{commit}}"],
              capture_output=True,
          ).returncode:
              subprocess.run(["git", "fetch", "--no-tags", "origin", base], check=True)

          changed = [
              path for path in git("diff", "--name-only", f"{base}...HEAD").splitlines()
              if path
          ]

          native_exact = {
              "mobile/apps/user/app.config.ts",
              "mobile/apps/user/eas.json",
              "mobile/apps/user/package.json",
              "mobile/apps/user/fingerprint.config.js",
              "mobile/package.json",
              "mobile/pnpm-lock.yaml",
              "mobile/pnpm-workspace.yaml",
              "mobile/.npmrc",
          }
          native_prefixes = (
              "mobile/apps/user/android/",
              "mobile/apps/user/ios/",
              "mobile/apps/user/plugins/",
          )
          native_extensions = {
              ".java", ".kt", ".swift", ".m", ".mm", ".h", ".hpp",
              ".c", ".cc", ".cpp", ".gradle", ".kts",
          }

          native = False
          ota = False
          e2e_harness = False

          for path in changed:
              parts = PurePosixPath(path).parts
              suffix = PurePosixPath(path).suffix.lower()
              is_native = (
                  path in native_exact
                  or path.endswith("/package.json")
                  or path.endswith("/expo-module.config.json")
                  or path.endswith("/react-native.config.js")
                  or path.startswith(native_prefixes)
                  or "android" in parts
                  or "ios" in parts
                  or suffix in native_extensions
              )

              if is_native:
                  native = True

              # Source/config/package edits can contain JS payload changes as
              # well as native inputs. Run both paths: the fingerprint decides
              # whether a binary rebuild is required; OTA carries compatible
              # runtime code after the authenticated journey passes.
              ota_paths = (
                  path.startswith(("mobile/apps/user/", "mobile/packages/"))
                  or path in {
                      "mobile/package.json",
                      "mobile/pnpm-lock.yaml",
                      "mobile/pnpm-workspace.yaml",
                  }
              )
              if ota_paths and path not in {
                  "mobile/apps/user/eas.json",
                  "mobile/apps/user/fingerprint.config.js",
              }:
                  ota = True

              if path.startswith("mobile/scripts/") or path == ".github/workflows/mobile-workspace.yml":
                  e2e_harness = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"native={str(native).lower()}\n")
              output.write(f"ota={str(ota).lower()}\n")
              output.write(f"e2e_harness={str(e2e_harness).lower()}\n")

          if native:
              decision = "NATIVE INPUT CHANGE: compare the Expo native fingerprint; rebuild the APK only when the fingerprint changes."
          elif ota:
              decision = "OTA-COMPATIBLE CHANGE: no APK build; export/type-check the bundle and publish preview OTA only on the permanent User branch or by explicit manual dispatch."
          elif e2e_harness:
              decision = "TEST-HARNESS CHANGE: reuse the cached APK and rerun the authenticated journey."
          else:
              decision = "No User runtime, native, or E2E-harness source change detected; no APK build is needed."

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## User app delivery classification\n\n")
              summary.write(f"- Changed files: {len(changed)}\n")
              summary.write(f"- Native rebuild required: **{str(native).lower()}**\n")
              summary.write(f"- OTA-compatible source changed: **{str(ota).lower()}**\n")
              summary.write(f"- E2E harness changed: **{str(e2e_harness).lower()}**\n\n")
              summary.write(decision + "\n")
          print(decision)
          print("Changed paths:")
          for path in changed:
              print(f" - {path}")
          PY

  mobile-typecheck:
    name: Expo dependency and TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check approved website handoffs and native account deletion
        run: pnpm navigation:check

      - name: Check User app Expo SDK dependency compatibility
        shell: bash
        run: |
          set -uo pipefail
          if pnpm --filter @afcon360/user-app exec expo install --check; then
            echo "Expo SDK package compatibility check passed."
          else
            echo "::warning::Expo recommends newer compatible patch versions for some SDK packages. The current lockfile remains pinned; continuing to the actual TypeScript and Android/iOS bundle gates rather than forcing a dependency update/native rebuild."
            {
              echo "## Expo SDK dependency advisory"
              echo
              echo "Expo reports newer recommended patch versions for some installed SDK packages. This is advisory for this validation run; TypeScript, Android/iOS bundle export, and the real native build remain required gates."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify User offline-first storage and session contracts
        run: node scripts/verify-user-offline-foundation.mjs

      - name: Validate production User app release configuration
        shell: bash
        run: |
          set -euo pipefail
          TEST_EAS_PROJECT_ID="00000000-0000-4000-8000-000000000001"
          AFCON360_USER_EAS_PROJECT_ID="$TEST_EAS_PROJECT_ID" \
          AFCON360_PREVIEW_BUILD="false" \
          AFCON360_RELEASE_BUILD="true" \
          EAS_BUILD="true" \
          EXPO_PUBLIC_API_BASE_URL="https://www.pamoja.space" \
            pnpm --filter @afcon360/user-app exec expo config --json \
              > /tmp/afcon360-user-production-config.json

          node - <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(
            fs.readFileSync("/tmp/afcon360-user-production-config.json", "utf8")
          );
          const eas = JSON.parse(fs.readFileSync("apps/user/eas.json", "utf8"));
          const expectedProjectId = "00000000-0000-4000-8000-000000000001";
          const expectedProfiles = {
            development: "development",
            preview: "preview",
            production: "production",
            "apk-share": "preview"
          };
          for (const [name, environment] of Object.entries(expectedProfiles)) {
            const profile = eas.build?.[name];
            const productionLike = name === "production";
            const valid =
              profile?.autoIncrement === true &&
              profile?.credentialsSource === "remote" &&
              profile?.environment === environment &&
              profile?.env?.AFCON360_PREVIEW_BUILD === (productionLike ? "false" : "true") &&
              profile?.env?.AFCON360_RELEASE_BUILD === (productionLike ? "true" : "false");
            const apkProfileValid = name !== "apk-share" ||
              (profile?.distribution === "internal" && profile?.android?.buildType === "apk" && profile?.channel === "preview");
            console.log(`${valid && apkProfileValid ? "PASS" : "FAIL"} EAS build profile: ${name}`);
            if (!valid || !apkProfileValid) process.exit(1);
          }
          const runtimeVersion = config.runtimeVersion;
          const runtimeVersionIsFingerprintPolicy =
            runtimeVersion &&
            typeof runtimeVersion === "object" &&
            runtimeVersion.policy === "fingerprint";
          const checks = {
            package: config.android?.package === "space.pamoja.afcon360.user",
            remoteVersionSeed: config.android?.versionCode === 1,
            api: config.extra?.apiBaseUrl === "https://www.pamoja.space",
            easProject: config.extra?.eas?.projectId === expectedProjectId,
            updatesUrl: config.updates?.url === `https://u.expo.dev/${expectedProjectId}`,
            productionChannel:
              config.updates?.requestHeaders?.["expo-channel-name"] === "production",
            runtimeVersionIsFingerprintPolicy
          };
          for (const [name, passed] of Object.entries(checks)) {
            console.log(`${passed ? "PASS" : "FAIL"} production config: ${name}`);
          }
          if (Object.values(checks).some((passed) => !passed)) process.exit(1);
          NODE

          if AFCON360_USER_EAS_PROJECT_ID="$TEST_EAS_PROJECT_ID" \
             AFCON360_PREVIEW_BUILD="false" \
             AFCON360_RELEASE_BUILD="true" \
             EAS_BUILD="true" \
             EXPO_PUBLIC_API_BASE_URL="http://127.0.0.1:5000" \
               pnpm --filter @afcon360/user-app exec expo config --json \
                 >/dev/null 2>/tmp/afcon360-user-loopback-config.err; then
            echo "::error::Production config unexpectedly accepted a loopback API URL."
            exit 1
          fi
          grep -Fq "production builds must use an HTTPS API endpoint" \
            /tmp/afcon360-user-loopback-config.err
          echo "PASS production config rejects loopback/HTTP API URLs."

          if env -u AFCON360_USER_EAS_PROJECT_ID -u EAS_BUILD_PROJECT_ID \
             AFCON360_PREVIEW_BUILD="false" \
             AFCON360_RELEASE_BUILD="true" \
             EAS_BUILD="true" \
             EXPO_PUBLIC_API_BASE_URL="https://www.pamoja.space" \
               pnpm --filter @afcon360/user-app exec expo config --json \
                 >/dev/null 2>/tmp/afcon360-user-missing-eas-id.err; then
            echo "::error::EAS build config unexpectedly resolved without an EAS project ID."
            exit 1
          fi
          grep -Fq "EAS builds require the dedicated EAS project ID" \
            /tmp/afcon360-user-missing-eas-id.err
          echo "PASS EAS build config fails when update-project linkage is missing."

      - name: Verify the two supported User App update methods
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const settings = fs.readFileSync("apps/user/app/(service)/settings.tsx", "utf8");
          const config = fs.readFileSync("apps/user/app.config.ts", "utf8");
          const checks = {
            otaCheck: settings.includes("Updates.checkForUpdateAsync()"),
            otaDownload: settings.includes("Updates.fetchUpdateAsync()"),
            otaApply: settings.includes("Updates.reloadAsync()"),
            otaAutomaticOnLaunch: config.includes('checkAutomatically: "ON_LOAD"'),
            e2eOtaChannelIsIsolated: config.includes('"afcon360-user-e2e"'),
            e2eOtaIsEnabled: !config.includes("updates: isE2EBuild ? { enabled: false }"),
            nativeFingerprintRuntime: config.includes('runtimeVersion: { policy: "fingerprint" }'),
            nativeBinaryHandoff: settings.includes("https://www.pamoja.space/download") &&
              settings.includes("Linking.openURL(officialDownloadsUrl)"),
            methodOneVisible: settings.includes("Method 1 · Compatible app updates"),
            methodTwoVisible: settings.includes("Method 2 · Full app update"),
            noRestrictedSelfInstaller:
              !settings.includes("REQUEST_INSTALL_PACKAGES") &&
              !settings.includes("PackageInstaller.Session") &&
              !config.includes("REQUEST_INSTALL_PACKAGES")
          };
          for (const [name, passed] of Object.entries(checks)) {
            console.log(`${passed ? "PASS" : "FAIL"} User update contract: ${name}`);
          }
          if (Object.values(checks).some((passed) => !passed)) process.exit(1);
          NODE

      - name: Type-check User application
        run: pnpm user:typecheck

      - name: Bundle User app for Android and iOS
        run: |
          pnpm --filter @afcon360/user-app exec expo export --platform android --output-dir /tmp/afcon360-user-android
          pnpm --filter @afcon360/user-app exec expo export --platform ios --output-dir /tmp/afcon360-user-ios

  publish-preview-ota:
    name: Publish User OTA update to preview channel
    needs: [classify-user-changes, mobile-typecheck]
    if: >-
      ${{
        needs.classify-user-changes.outputs.ota == 'true' &&
        needs.classify-user-changes.outputs.native != 'true' &&
        needs.mobile-typecheck.result == 'success' &&
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == 'feat/native-user-app-integration-20261108' &&
        inputs.publish_preview_ota == true
      }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: "1"
      AFCON360_PREVIEW_BUILD: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check EAS publishing credentials
        id: eas-credentials
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN:-}" ] || [ -z "${AFCON360_USER_EAS_PROJECT_ID:-}" ]; then
            echo "::warning::Preview OTA was not published. Configure the EXPO_TOKEN secret and AFCON360_USER_EAS_PROJECT_ID repository variable."
            echo "No OTA was published because EAS publishing credentials are incomplete." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publish JavaScript update to the preview channel
        if: steps.eas-credentials.outputs.ready == 'true'
        working-directory: mobile/apps/user
        env:
          AFCON360_PREVIEW_BUILD: "true"
        run: >-
          npx --yes eas-cli@latest update
          --branch preview
          --environment preview
          --platform all
          --message "AFCON360 User preview OTA ${GITHUB_SHA}"
          --non-interactive

  user-authenticated-journey:
    name: User APK — login, protected journeys, restore and logout
    needs: classify-user-changes
    if: >-
      ${{
        needs.classify-user-changes.outputs.native == 'true' ||
        needs.classify-user-changes.outputs.ota == 'true' ||
        needs.classify-user-changes.outputs.e2e_harness == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_apk_rebuild == true)
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    outputs:
      apk_ready: ${{ steps.stage_user_apk.outputs.ready }}
      apk_rebuilt: ${{ steps.validate-user-apk.outputs.reusable != 'true' }}
      native_fingerprint: ${{ steps.user-apk-key.outputs.fingerprint }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afcon360_mobile_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afcon360_mobile_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: local
      FLASK_ENV: testing
      SECRET_KEY: "ci-only-not-a-production-secret"
      SECURITY_SALT: "ci-only-security-salt-value-long-enough-for-tests-2026"
      ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      REFUND_POLICY_SIGNING_KEY: "ci-only-refund-policy-signing-key-not-production"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afcon360_mobile_e2e_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afcon360_mobile_e2e_test
      REDIS_URL: redis://localhost:6379/15
      DISABLE_REDIS: "0"
      SOCKETIO_ENABLED: "false"
      ANALYTICS_ENABLED: "false"
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
      MAIL_SUPPRESS_SEND: "true"
      AFCON360_E2E_BACKEND_ROOT: ${{ github.workspace }}/backend-main
      AFCON360_E2E_USERNAME: native_e2e_user
      AFCON360_E2E_EMAIL: native-e2e@afcon360.test
      AFCON360_E2E_PASSWORD: NativeE2ePassword2026
      AFCON360_E2E_EVIDENCE_DIR: mobile-e2e-evidence
      AFCON360_E2E_REQUEST_LOG: mobile-e2e-evidence/backend-requests.tsv
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check out backend main for the test API
        uses: actions/checkout@v7
        with:
          ref: main
          path: backend-main

      - name: Record backend main revision
        working-directory: backend-main
        run: |
          echo "Backend test source: $(git rev-parse HEAD)"
          echo "Backend branch: $(git branch --show-current)"

      - name: Set up Node.js for native fingerprinting and APK reuse
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
      - name: Set up pnpm for native fingerprinting and APK reuse
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false
      - name: Install User workspace dependencies for native fingerprinting
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile

      - name: Prepare User APK cache directory
        run: mkdir -p mobile-e2e-cache
      - name: Calculate Expo native fingerprint and APK cache key
        id: user-apk-key
        working-directory: mobile/apps/user
        env:
          AFCON360_PREVIEW_BUILD: "true"
          AFCON360_E2E_BUILD: "true"
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT="$(node ../../scripts/user-native-fingerprint.cjs)"
          test -n "$FINGERPRINT"
          # Bump the recipe version only when the disposable APK build recipe
          # changes (manifest override, SDK/build tools, signing mode or Gradle task).
          KEY="afcon360-user-e2e-apk-recipe-${AFCON360_USER_E2E_APK_RECIPE_VERSION}-native-$FINGERPRINT"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Native Android fingerprint: $FINGERPRINT"
          echo "Reusable APK cache key: $KEY"
      - name: Restore native-fingerprint-keyed User E2E APK
        id: user-apk-cache
        uses: actions/cache/restore@v5
        with:
          path: mobile-e2e-cache/
          key: ${{ steps.user-apk-key.outputs.key }}
          restore-keys: |
            afcon360-user-e2e-apk-recipe-v3-native-
            afcon360-user-e2e-apk-v2-

      - name: Validate cached User APK against native fingerprint
        id: validate-user-apk
        shell: bash
        env:
          USER_APK_CACHE_MATCHED_KEY: ${{ steps.user-apk-cache.outputs.cache-matched-key }}
          USER_APK_NATIVE_FINGERPRINT: ${{ steps.user-apk-key.outputs.fingerprint }}
          FORCE_USER_APK_REBUILD: ${{ inputs.force_apk_rebuild == true }}
        run: |
          set -euo pipefail
          echo "reusable=false" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_USER_APK_REBUILD" = "true" ]; then
            echo "A fresh disposable User APK build was explicitly requested."
            exit 0
          fi
          if [ -z "$USER_APK_CACHE_MATCHED_KEY" ]; then
            echo "No cached User E2E APK was restored."
            exit 0
          fi

          APK="mobile-e2e-cache/user-e2e.apk"
          INFO="mobile-e2e-cache/build-info.txt"
          test -s "$APK" || exit 0
          test -s "$INFO" || exit 0
          EXPECTED_SHA="$(sed -n 's/^apk_sha256=//p' "$INFO" | head -n 1)"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$ACTUAL_SHA" || exit 0

          CACHED_FINGERPRINT="$(sed -n 's/^native_fingerprint=//p' "$INFO" | head -n 1)"
          if [ -n "$CACHED_FINGERPRINT" ]; then
            if [ "$CACHED_FINGERPRINT" != "$USER_APK_NATIVE_FINGERPRINT" ]; then
              echo "Cached APK native fingerprint differs; build a compatible native binary."
              exit 0
            fi
            echo "Cached APK native fingerprint matches the Android runtime."
          else
            # One-time safe migration for older source-keyed cache entries.
            # The legacy build did not record an Expo fingerprint, so only
            # reuse it when every known native/build input is unchanged.
            SOURCE_COMMIT="$(sed -n 's/^source_commit=//p' "$INFO" | head -n 1)"
            test -n "$SOURCE_COMMIT" || exit 0
            git fetch --no-tags --depth=1 origin "$SOURCE_COMMIT"
            if ! git diff --quiet "$SOURCE_COMMIT" "$GITHUB_SHA" -- \
              mobile/apps/user/app.config.ts \
              mobile/apps/user/package.json \
              mobile/apps/user/plugins \
              mobile/apps/user/android \
              mobile/apps/user/ios \
              mobile/package.json \
              mobile/pnpm-lock.yaml \
              mobile/pnpm-workspace.yaml \
              mobile/.npmrc \
              'mobile/packages/*/package.json'; then
              echo "Legacy APK cannot be proven native-compatible; build a fresh APK."
              exit 0
            fi
            printf 'native_fingerprint=%s\n' "$USER_APK_NATIVE_FINGERPRINT" >> "$INFO"
            echo "Legacy APK native inputs are unchanged; migrated it to fingerprint validation."
          fi

          echo "reusable=true" >> "$GITHUB_OUTPUT"
          echo "Verified reusable APK SHA-256: $ACTUAL_SHA"

      - name: Save validated User APK under its native fingerprint key
        if: steps.validate-user-apk.outputs.reusable == 'true' && steps.user-apk-cache.outputs['cache-hit'] != 'true'
        uses: actions/cache/save@v5
        with:
          path: mobile-e2e-cache/
          key: ${{ steps.user-apk-key.outputs.key }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend-main/requirements.txt
      - name: Install Flask backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend-main/requirements.txt
      - name: Build a fresh disposable PostgreSQL schema from backend main
        working-directory: backend-main
        run: python -m flask --app 'app:create_app()' db upgrade

      - name: Ensure current SystemConfig model exists in disposable E2E schema
        working-directory: backend-main
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          from app import create_app
          from app.extensions import db
          from app.identity.models.user import User  # register the users FK target
          from app.models.system_config import SystemConfig

          # create_app() reads SystemConfig during startup. The disposable
          # migration-built test DB can lag backend main by this additive table,
          # so create the model table BEFORE create_app() is allowed to query it.
          engine = create_engine(os.environ["DATABASE_URL"], future=True)
          try:
              existed = inspect(engine).has_table(SystemConfig.__tablename__)
              db.Model.metadata.create_all(
                  bind=engine,
                  tables=[SystemConfig.__table__],
                  checkfirst=True,
              )
          finally:
              engine.dispose()

          app = create_app()
          with app.app_context():
              created = SystemConfig.initialize_defaults()
              print(
                  "E2E SystemConfig schema ready before app startup: "
                  f"table_preexisting={existed}, defaults_created={created}"
              )
          PY

      - name: Seed one synthetic, non-MFA AFCON360 User
        run: python mobile/scripts/mobile-user-e2e-backend.py seed
      - name: Start isolated Flask API and wait for health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-e2e-evidence
          nohup python mobile/scripts/mobile-user-e2e-backend.py serve > mobile-e2e-evidence/backend.log 2>&1 < /dev/null &
          echo $! > mobile-e2e-evidence/backend.pid
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:5000/api/health/ping >/dev/null; then
              echo "Disposable AFCON360 API is healthy."
              exit 0
            fi
            sleep 2
          done
          cat mobile-e2e-evidence/backend.log
          echo "::error::Disposable AFCON360 API did not become healthy."
          exit 1
      - name: Set up Java
        if: steps.validate-user-apk.outputs.reusable != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Check User app Expo dependency compatibility
        if: steps.validate-user-apk.outputs.reusable != 'true'
        working-directory: mobile
        shell: bash
        run: |
          set -uo pipefail
          if pnpm --filter "@afcon360/user-app" exec expo install --check; then
            echo "Expo SDK package compatibility check passed."
          else
            echo "::warning::Expo recommends newer compatible patch versions. Keep the existing dependency lock for this native proof build; actual Expo prebuild and Gradle compilation remain blocking gates."
            {
              echo "## Expo SDK dependency advisory"
              echo
              echo "Expo recommends newer patch versions. The current lockfile was not changed solely to chase this advisory; actual Android prebuild and Gradle compilation remain blocking gates."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install Android platform and build tools
        if: steps.validate-user-apk.outputs.reusable != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
      - name: Generate a fresh User APK pointing only to the disposable local API
        if: steps.validate-user-apk.outputs.reusable != 'true'
        working-directory: mobile
        env:
          AFCON360_PREVIEW_BUILD: "true"
          AFCON360_E2E_BUILD: "true"
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
        run: pnpm --filter "@afcon360/user-app" exec expo prebuild --platform android --no-install --clean
      - name: Allow private-network HTTP only in this disposable preview APK
        if: steps.validate-user-apk.outputs.reusable != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          manifest = Path("mobile/apps/user/android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          if not re.search(r"\bxmlns:android\s*=", source[:2000]):
              raise SystemExit("Generated Android manifest is missing its android namespace declaration.")
          app_tag = re.search(r"<application\b[^>]*>", source, flags=re.DOTALL)
          if app_tag is None:
              raise SystemExit("Generated Android manifest has no application element.")
          opening = app_tag.group(0)
          if re.search(r"\bandroid:usesCleartextTraffic\s*=", opening):
              opening = re.sub(
                  r"\bandroid:usesCleartextTraffic\s*=\s*[\"'][^\"']*[\"']",
                  'android:usesCleartextTraffic="true"',
                  opening,
              )
          else:
              opening = opening[:-1] + ' android:usesCleartextTraffic="true">'
          source = source[:app_tag.start()] + opening + source[app_tag.end():]
          ET.fromstring(source)
          manifest.write_text(source, encoding="utf-8")
          print("HTTP enabled only in this disposable preview APK; runtime API validation restricts selected HTTP servers to loopback or private IPv4.")
          PY
      - name: Configure ephemeral release signing
        if: steps.validate-user-apk.outputs.reusable != 'true'
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "apps/user/android/app/build.gradle";
          let source = fs.readFileSync(path, "utf8");
          const buildTypes = source.indexOf("buildTypes {");
          const release = source.indexOf("release {", buildTypes);
          if (buildTypes < 0 || release < 0) throw new Error("Could not find Android release build type");
          const open = source.indexOf("{", release);
          let depth = 0;
          let end = -1;
          for (let i = open; i < source.length; i++) {
            if (source[i] === "{") depth++;
            if (source[i] === "}") {
              depth--;
              if (depth === 0) { end = i + 1; break; }
            }
          }
          if (end < 0) throw new Error("Could not find end of Android release build type");
          let block = source.slice(release, end);
          const signing = /signingConfig\s+signingConfigs\.[A-Za-z0-9_]+/;
          if (signing.test(block)) block = block.replace(signing, "signingConfig signingConfigs.debug");
          else block = block.replace("release {", "release {\n            signingConfig signingConfigs.debug");
          source = source.slice(0, release) + block + source.slice(end);
          fs.writeFileSync(path, source);
          NODE
      - name: Build isolated User release APK
        if: steps.validate-user-apk.outputs.reusable != 'true'
        working-directory: mobile/apps/user/android
        env:
          # Re-evaluate the dynamic Expo config during Metro/Gradle bundling too,
          # so the embedded manifest retains preview-only server selection.
          AFCON360_PREVIEW_BUILD: "true"
          AFCON360_E2E_BUILD: "true"
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Save fresh APK under the source-keyed cache key
        if: steps.validate-user-apk.outputs.reusable != 'true'
        shell: bash
        env:
          USER_APK_CACHE_KEY: ${{ steps.user-apk-key.outputs.key }}
          USER_APK_NATIVE_FINGERPRINT: ${{ steps.user-apk-key.outputs.fingerprint }}
        run: |
          set -euo pipefail
          APK="$(find mobile/apps/user/android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          mkdir -p mobile-e2e-cache
          cp "$APK" mobile-e2e-cache/user-e2e.apk
          APK_SHA256="$(sha256sum mobile-e2e-cache/user-e2e.apk | awk '{print $1}')"
          BADGING="$(aapt dump badging mobile-e2e-cache/user-e2e.apk)"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p" | head -n 1)"
          MINIMUM="$(printf '%s\n' "$BADGING" | sed -n "s/.*sdkVersion:'\\([0-9]*\\)'.*/\\1/p" | head -n 1)"
          TARGET="$(printf '%s\n' "$BADGING" | sed -n "s/.*targetSdkVersion:'\\([0-9]*\\)'.*/\\1/p" | head -n 1)"
          test "$PACKAGE" = "space.pamoja.afcon360.user.preview"
          test "$MINIMUM" = "24"
          test -n "$TARGET" && test "$TARGET" -ge 36
          echo "Verified APK package=$PACKAGE minSdkVersion=$MINIMUM targetSdkVersion=$TARGET"
          cat > mobile-e2e-cache/build-info.txt <<EOF
          app=user
          package=$PACKAGE
          min_sdk=$MINIMUM
          target_sdk=$TARGET
          api_origin=http://127.0.0.1:5000
          source_commit=$GITHUB_SHA
          cache_key=$USER_APK_CACHE_KEY
          native_fingerprint=$USER_APK_NATIVE_FINGERPRINT
          apk_sha256=$APK_SHA256
          EOF
      - name: Persist fresh User APK immediately
        if: steps.validate-user-apk.outputs.reusable != 'true'
        uses: actions/cache/save@v5
        with:
          path: mobile-e2e-cache/
          key: ${{ steps.user-apk-key.outputs.key }}
      - name: Stage and verify cached User APK for this journey
        id: stage_user_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile-e2e-cache/user-e2e.apk"
          INFO="mobile-e2e-cache/build-info.txt"
          test -s "$APK"
          test -s "$INFO"
          EXPECTED_SHA="$(sed -n 's/^apk_sha256=//p' "$INFO" | head -n 1)"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          mkdir -p mobile-e2e-evidence
          cp "$APK" mobile-e2e-evidence/user-e2e.apk
          cp "$INFO" mobile-e2e-evidence/user-e2e-build-info.txt
          printf '%s  %s\n' "$ACTUAL_SHA" "user-e2e.apk" | tee mobile-e2e-evidence/user-e2e-apk.sha256
          echo "Verified reusable User APK (cache_hit=${{ steps.user-apk-cache.outputs['cache-hit'] }}): $ACTUAL_SHA"
          cat mobile-e2e-evidence/user-e2e-build-info.txt
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Publish current JavaScript bundle to isolated User E2E OTA channel
        if: needs.classify-user-changes.outputs.ota == 'true'
        working-directory: mobile/apps/user
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          AFCON360_PREVIEW_BUILD: "true"
          AFCON360_E2E_BUILD: "true"
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
          EXPO_NO_TELEMETRY: "1"
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || {
            echo "::error::EXPO_TOKEN is required to test OTA-compatible changes on the isolated E2E channel."
            exit 1
          }
          CHANNEL="afcon360-user-e2e"
          # Keep this branch/channel separate from the user-facing preview channel.
          if ! npx --yes eas-cli@latest channel:view "$CHANNEL" --json >/dev/null 2>&1; then
            npx --yes eas-cli@latest channel:create "$CHANNEL" --non-interactive
          fi
          if ! npx --yes eas-cli@latest branch:view "$CHANNEL" --json >/dev/null 2>&1; then
            npx --yes eas-cli@latest branch:create "$CHANNEL" --non-interactive
          fi
          npx --yes eas-cli@latest channel:edit "$CHANNEL" --branch "$CHANNEL" --non-interactive
          npx --yes eas-cli@latest update \
            --branch "$CHANNEL" \
            --environment preview \
            --platform android \
            --message "AFCON360 User E2E JS ${GITHUB_SHA}" \
            --non-interactive
          echo "Published the current OTA-compatible JS bundle to the isolated $CHANNEL channel."
      - name: Upload verified APK for independent Android compatibility matrix
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-user-platform-test-apk
          path: |
            mobile-e2e-evidence/user-e2e.apk
            mobile-e2e-evidence/user-e2e-apk.sha256
            mobile-e2e-evidence/user-e2e-build-info.txt
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; hardware acceleration is unavailable."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install, authenticate, test services, restore session and sign out
        id: android_journey
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          disable-linux-hw-accel: false
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          emulator-boot-timeout: 600
          script: python mobile/scripts/verify-user-authenticated-journey.py
      - name: Verify server-side logout and protected API evidence
        if: ${{ steps.android_journey.outcome == 'success' }}
        run: python mobile/scripts/mobile-user-e2e-backend.py assert
      - name: Upload User Android journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-user-android-e2e-evidence
          path: mobile-e2e-evidence/
          if-no-files-found: warn
          retention-days: 90

  user-android-version-compatibility:
    name: User authenticated journey — ${{ matrix.android-label }}
    needs: user-authenticated-journey
    if: ${{ always() && needs.user-authenticated-journey.outputs.apk_ready == 'true' && needs.user-authenticated-journey.outputs.apk_rebuilt == 'true' && github.ref_name != 'fix/user-release-engineering-20261115' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afcon360_mobile_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afcon360_mobile_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: local
      FLASK_ENV: testing
      SECRET_KEY: "ci-only-not-a-production-secret"
      SECURITY_SALT: "ci-only-security-salt-value-long-enough-for-tests-2026"
      ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      REFUND_POLICY_SIGNING_KEY: "ci-only-refund-policy-signing-key-not-production"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afcon360_mobile_e2e_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afcon360_mobile_e2e_test
      REDIS_URL: redis://localhost:6379/15
      DISABLE_REDIS: "0"
      SOCKETIO_ENABLED: "false"
      ANALYTICS_ENABLED: "false"
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
      MAIL_SUPPRESS_SEND: "true"
      AFCON360_E2E_BACKEND_ROOT: ${{ github.workspace }}/backend-main
      AFCON360_E2E_USERNAME: native_e2e_user
      AFCON360_E2E_EMAIL: native-e2e@afcon360.test
      AFCON360_E2E_PASSWORD: NativeE2ePassword2026
      AFCON360_E2E_EVIDENCE_DIR: android-compat-evidence/${{ matrix.android-label }}
      AFCON360_E2E_REQUEST_LOG: android-compat-evidence/${{ matrix.android-label }}/backend-requests.tsv
      AFCON360_USER_E2E_APK: mobile-e2e-artifact/user-e2e.apk
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - android-label: android-7.0
            api-level: '24'
            system-image-api-level: '24'
            expected-api: '24'
            target: default
            profile: Nexus 5X
            ram-size: 2048M
          - android-label: android-7.1
            api-level: '25'
            system-image-api-level: '25'
            expected-api: '25'
            target: default
            profile: Nexus 5X
            ram-size: 2048M
          - android-label: android-8.0
            api-level: '26'
            system-image-api-level: '26'
            expected-api: '26'
          - android-label: android-8.1
            api-level: '27'
            system-image-api-level: '27'
            target: default
            expected-api: '27'
          - android-label: android-9
            api-level: '28'
            system-image-api-level: '28'
            expected-api: '28'
          - android-label: android-10
            api-level: '29'
            system-image-api-level: '29'
            expected-api: '29'
          - android-label: android-11
            api-level: '30'
            system-image-api-level: '30'
            expected-api: '30'
          - android-label: android-12
            api-level: '31'
            system-image-api-level: '31'
            expected-api: '31'
          - android-label: android-12l
            api-level: '32'
            system-image-api-level: '32'
            expected-api: '32'
          - android-label: android-13
            api-level: '33'
            system-image-api-level: '33'
            expected-api: '33'
          - android-label: android-14
            api-level: '34'
            system-image-api-level: '34'
            expected-api: '34'
            target: default
            profile: Nexus 5X
            ram-size: 3072M
          - android-label: android-15
            api-level: '35'
            system-image-api-level: '35'
            expected-api: '35'
          - android-label: android-16
            api-level: '36'
            system-image-api-level: '36'
            expected-api: '36'
          - android-label: android-17
            api-level: '37.0'
            system-image-api-level: '37.0'
            target: default
            expected-api: '37'
    steps:
      - name: Check out User app and backend verification source
        uses: actions/checkout@v7

      - name: Check out backend main for the compatibility API
        uses: actions/checkout@v7
        with:
          ref: main
          path: backend-main

      - name: Record backend main revision
        working-directory: backend-main
        run: |
          echo "Backend test source: $(git rev-parse HEAD)"
          echo "Backend branch: $(git branch --show-current)"

      - name: Download the exact APK staged by the primary User journey
        uses: actions/download-artifact@v8
        with:
          name: afcon360-user-platform-test-apk
          path: mobile-e2e-artifact

      - name: Verify exact APK provenance and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s "$AFCON360_USER_E2E_APK"
          test -s mobile-e2e-artifact/user-e2e-apk.sha256
          test -s mobile-e2e-artifact/user-e2e-build-info.txt
          grep -Fxq "app=user" mobile-e2e-artifact/user-e2e-build-info.txt
          grep -Fxq "package=space.pamoja.afcon360.user.preview" mobile-e2e-artifact/user-e2e-build-info.txt
          EXPECTED_SHA="$(awk 'NR == 1 { print $1 }' mobile-e2e-artifact/user-e2e-apk.sha256)"
          ACTUAL_SHA="$(sha256sum "$AFCON360_USER_E2E_APK" | awk '{ print $1 }')"
          test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          echo "Verified the same source APK ($ACTUAL_SHA) for ${{ matrix.android-label }}."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend-main/requirements.txt

      - name: Install isolated Flask backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend-main/requirements.txt

      - name: Build a fresh isolated PostgreSQL schema from backend main
        working-directory: backend-main
        run: python -m flask --app 'app:create_app()' db upgrade

      - name: Ensure current SystemConfig model exists in disposable E2E schema
        working-directory: backend-main
        run: |
          python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.models.system_config import SystemConfig

          app = create_app()
          with app.app_context():
              existed = db.inspect(db.engine).has_table(SystemConfig.__tablename__)
              SystemConfig.__table__.create(bind=db.engine, checkfirst=True)
              created = SystemConfig.initialize_defaults()
              print(
                  "E2E SystemConfig schema ready: "
                  f"table_preexisting={existed}, defaults_created={created}"
              )
          PY

      - name: Seed one synthetic, non-MFA User for this Android version
        run: python mobile/scripts/mobile-user-e2e-backend.py seed

      - name: Start this version's isolated Flask API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AFCON360_E2E_EVIDENCE_DIR"
          nohup python mobile/scripts/mobile-user-e2e-backend.py serve \
            > "$AFCON360_E2E_EVIDENCE_DIR/backend.log" 2>&1 < /dev/null &
          echo $! > "$AFCON360_E2E_EVIDENCE_DIR/backend.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:5000/api/health/ping >/dev/null; then
              echo "Isolated API is healthy for ${{ matrix.android-label }}."
              exit 0
            fi
            sleep 2
          done
          cat "$AFCON360_E2E_EVIDENCE_DIR/backend.log"
          echo "::error::The isolated API did not become healthy."
          exit 1

      - name: Install compatible Android SDK tools and prepare Android 17 AVD profile
        id: android17_sdk
        if: matrix.android-label == 'android-17'
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          CLT_ROOT="$SDK/cmdline-tools"
          CLT="$CLT_ROOT/latest"
          SDKMANAGER="$CLT/bin/sdkmanager"
          AVDMANAGER="$CLT/bin/avdmanager"
          ANDROID_CLI="$CLT/bin/android"

          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"

          cmdline_tools_revision() {
            local properties_file="$1/source.properties"
            test -s "$properties_file" || return 1
            awk -F= '$1 == "Pkg.Revision" { gsub(/[[:space:]]/, "", $2); print $2; exit }' "$properties_file"
          }

          CURRENT_VERSION="$(cmdline_tools_revision "$CLT")"
          CURRENT_MAJOR="${CURRENT_VERSION%%.*}"
          echo "Pre-update Android SDK command-line tools revision: ${CURRENT_VERSION:-unknown}"
          if ! [[ "$CURRENT_MAJOR" =~ ^[0-9]+$ ]] || [ "$CURRENT_MAJOR" -lt 20 ]; then
            set +o pipefail
            yes 2>/dev/null | "$SDKMANAGER" --install "cmdline-tools;latest" >/dev/null
            set -o pipefail

            UPDATED_CLT="$(find "$CLT_ROOT" -mindepth 1 -maxdepth 1 -type d -name 'latest-*' -printf '%f\n' | sort -V | tail -n 1)"
            if [ -z "$UPDATED_CLT" ]; then
              echo "::error::Updated Android command-line tools were not installed."
              exit 1
            fi
            rm -rf "$CLT_ROOT/latest"
            mv "$CLT_ROOT/$UPDATED_CLT" "$CLT_ROOT/latest"
          fi

          CLT="$CLT_ROOT/latest"
          SDKMANAGER="$CLT/bin/sdkmanager"
          AVDMANAGER="$CLT/bin/avdmanager"
          ANDROID_CLI="$CLT/bin/android"
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          test -x "$ANDROID_CLI"

          UPDATED_VERSION="$(cmdline_tools_revision "$CLT")"
          UPDATED_MAJOR="${UPDATED_VERSION%%.*}"
          if ! [[ "$UPDATED_MAJOR" =~ ^[0-9]+$ ]] || [ "$UPDATED_MAJOR" -lt 20 ]; then
            echo "::error::Expected command-line tools 20.0 or newer; found ${UPDATED_VERSION:-unknown}."
            exit 1
          fi
          echo "Updated Android SDK command-line tools revision: $UPDATED_VERSION"
          "$ANDROID_CLI" --version

          # Install the Android 17 system image and the emulator runtime.
          # Do not manually create a throwaway AVD here: the emulator runner
          # below owns AVD creation and launch, using its supported invocation.
          "$ANDROID_CLI" sdk install emulator
          "$ANDROID_CLI" sdk install "system-images/android-37.0/default/x86_64"

          IMAGE="system-images;android-37.0;default;x86_64"
          IMAGE_DIR="$SDK/system-images/android-37.0/default/x86_64"
          test -s "$IMAGE_DIR/system.img"

          DEVICE_IDS="$("$AVDMANAGER" list device -c | tr -d '\r')"
          echo "Available Android AVD hardware profile IDs:"
          printf '%s\n' "$DEVICE_IDS"

          AVD_PROFILE=""
          for candidate in pixel_7 pixel_7_pro pixel_6 pixel_5 pixel_4 pixel "Nexus 5X"; do
            if grep -Fxq -- "$candidate" <<< "$DEVICE_IDS"; then
              AVD_PROFILE="$candidate"
              break
            fi
          done
          if [ -z "$AVD_PROFILE" ]; then
            echo "::error::No supported Pixel/Nexus phone profile was found."
            exit 1
          fi
          echo "Selected Android 17 phone profile: $AVD_PROFILE"
          echo "avd_profile=$AVD_PROFILE" >> "$GITHUB_OUTPUT"
          echo "ANDROID_17_SDK_IMAGE_READY: $IMAGE"
          echo "ANDROID_17_AVD_PROFILE_READY: $AVD_PROFILE"

      - name: Enable hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run the complete User journey on ${{ matrix.android-label }}
        id: android_journey
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          system-image-api-level: ${{ matrix.system-image-api-level }}
          target: ${{ matrix.target || 'google_apis' }}
          arch: ${{ matrix.arch || 'x86_64' }}
          profile: ${{ steps.android17_sdk.outputs.avd_profile || matrix.profile || 'pixel_7' }}
          ram-size: ${{ matrix.ram-size || '4096M' }}
          disk-size: ${{ matrix.disk-size || '12G' }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          emulator-boot-timeout: 900
          script: python mobile/scripts/verify-user-authenticated-journey.py

      - name: Verify protected APIs and server-side logout for this Android version
        if: ${{ steps.android_journey.outcome == 'success' }}
        run: python mobile/scripts/mobile-user-e2e-backend.py assert

      - name: Upload full Android journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-user-${{ matrix.android-label }}-journey-evidence
          path: android-compat-evidence/${{ matrix.android-label }}/
          if-no-files-found: warn
          retention-days: 30

  

  build-user-dev-apk:
    name: Build or reuse signed User development APK
    needs: [classify-user-changes, mobile-typecheck, user-authenticated-journey]
    if: >-
      ${{
        (github.event_name == 'push' ||
         github.event_name == 'workflow_dispatch') &&
        github.ref_name == 'feat/user-offline-first-foundation-20261117' &&
        needs.mobile-typecheck.result == 'success' &&
        needs.user-authenticated-journey.result == 'success' &&
        needs.user-authenticated-journey.outputs.apk_ready == 'true'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      AFCON360_USER_EAS_PROJECT_ID: ${{ vars.AFCON360_USER_EAS_PROJECT_ID }}
      AFCON360_PREVIEW_BUILD: "true"
      AFCON360_RELEASE_BUILD: "false"
      AFCON360_UPDATE_CHANNEL: "user-development"
      EXPO_PUBLIC_API_BASE_URL: https://www.pamoja.space
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out validated User App source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Install User workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Calculate signed developer APK native fingerprint and cache key
        id: dev-apk-key
        working-directory: mobile/apps/user
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT="$(node ../../scripts/user-native-fingerprint.cjs)"
          test -n "$FINGERPRINT"
          pnpm exec expo config --json > "$RUNNER_TEMP/afcon360-user-dev-config.json"
          VERSION_NAME="$(node -e 'const c=require(process.argv[1]); if(!c.version) process.exit(2); process.stdout.write(c.version)' "$RUNNER_TEMP/afcon360-user-dev-config.json")"
          PROFILE_SHA256="$(node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const profile = JSON.parse(fs.readFileSync("eas.json", "utf8")).build?.["dev-apk"];
          if (!profile) throw new Error("eas.json build.dev-apk profile is missing.");
          const stable = value => Array.isArray(value)
            ? value.map(stable)
            : value && typeof value === "object"
              ? Object.fromEntries(Object.keys(value).sort().map(k => [k, stable(value[k])]))
              : value;
          process.stdout.write(crypto.createHash("sha256").update(JSON.stringify(stable(profile))).digest("hex"));
          NODE
          )"
          VERSION_SHA256="$(printf '%s' "$VERSION_NAME" | sha256sum | awk '{print $1}')"
          # Bump recipe-v1 only when the EAS invocation, artifact validation or signing workflow changes.
          KEY="afcon360-user-dev-apk-recipe-v1-native-$FINGERPRINT-profile-$PROFILE_SHA256-version-$VERSION_SHA256"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "profile_sha256=$PROFILE_SHA256" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_sha256=$VERSION_SHA256" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Signed developer APK native fingerprint: $FINGERPRINT"
          echo "Developer EAS profile SHA-256: $PROFILE_SHA256"
          echo "App version: $VERSION_NAME"
          echo "Reusable signed APK key: $KEY"

      - name: Restore signed User development APK by native fingerprint
        id: dev-apk-cache
        uses: actions/cache/restore@v5
        with:
          path: user-dev-apk-cache/
          key: ${{ steps.dev-apk-key.outputs.key }}

      - name: Validate cached signed developer APK
        id: validate-dev-apk
        working-directory: .
        shell: bash
        env:
          CACHE_MATCHED_KEY: ${{ steps.dev-apk-cache.outputs.cache-matched-key }}
          EXPECTED_FINGERPRINT: ${{ steps.dev-apk-key.outputs.fingerprint }}
          EXPECTED_PROFILE_SHA256: ${{ steps.dev-apk-key.outputs.profile_sha256 }}
          EXPECTED_VERSION_NAME: ${{ steps.dev-apk-key.outputs.version_name }}
          FORCE_REBUILD: ${{ inputs.force_apk_rebuild == true }}
        run: |
          set -euo pipefail
          echo "reusable=false" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "A signed developer APK rebuild was explicitly requested."
            exit 0
          fi
          [ "$CACHE_MATCHED_KEY" = "${{ steps.dev-apk-key.outputs.key }}" ] || {
            echo "No exact signed developer APK cache entry was restored."
            exit 0
          }
          APK="user-dev-apk-cache/user-development.apk"
          INFO="user-dev-apk-cache/build-info.txt"
          test -s "$APK" && test -s "$INFO" || exit 0
          EXPECTED_SHA="$(sed -n 's/^apk_sha256=//p' "$INFO" | head -n 1)"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$ACTUAL_SHA" || exit 0
          grep -Fxq "native_fingerprint=$EXPECTED_FINGERPRINT" "$INFO" || exit 0
          grep -Fxq "profile_sha256=$EXPECTED_PROFILE_SHA256" "$INFO" || exit 0
          grep -Fxq "version_name=$EXPECTED_VERSION_NAME" "$INFO" || exit 0
          grep -Fxq "package=space.pamoja.afcon360.user.preview" "$INFO" || exit 0
          grep -Fxq "api=https://www.pamoja.space" "$INFO" || exit 0
          grep -Fxq "update_channel=user-development" "$INFO" || exit 0
          echo "Exact signed developer APK cache hit; SHA-256 verified: $ACTUAL_SHA"
          echo "reusable=true" >> "$GITHUB_OUTPUT"

      - name: Ensure isolated User development update channel exists
        working-directory: mobile/apps/user
        shell: bash
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || {
            echo "::error::EXPO_TOKEN is required for the signed User development APK and its isolated OTA channel."
            exit 1
          }
          CHANNEL="user-development"
          if ! npx --yes eas-cli@latest channel:view "$CHANNEL" --json >/dev/null 2>&1; then
            npx --yes eas-cli@latest channel:create "$CHANNEL" --non-interactive
          fi
          if ! npx --yes eas-cli@latest branch:view "$CHANNEL" --json >/dev/null 2>&1; then
            npx --yes eas-cli@latest branch:create "$CHANNEL" --non-interactive
          fi
          npx --yes eas-cli@latest channel:edit "$CHANNEL" --branch "$CHANNEL" --non-interactive

      - name: Build signed User development APK with frozen remote credentials
        id: eas-build
        if: steps.validate-dev-apk.outputs.reusable != 'true'
        working-directory: mobile/apps/user
        shell: bash
        run: |
          set -euo pipefail
          [[ "${AFCON360_USER_EAS_PROJECT_ID:-}" =~ ^[0-9a-fA-F-]{36}$ ]] || {
            echo "::error::AFCON360_USER_EAS_PROJECT_ID is missing or invalid."
            exit 1
          }
          EAS_BUILD=true pnpm exec expo config --json > "$RUNNER_TEMP/afcon360-user-dev-eas-config.json"
          node - "$RUNNER_TEMP/afcon360-user-dev-eas-config.json" <<'NODE'
          const fs = require("node:fs");
          const c = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expectedProject = process.env.AFCON360_USER_EAS_PROJECT_ID;
          const checks = {
            package: c.android?.package === "space.pamoja.afcon360.user.preview",
            liveApi: c.extra?.apiBaseUrl === "https://www.pamoja.space",
            updateChannel: c.updates?.requestHeaders?.["expo-channel-name"] === "user-development",
            fingerprintRuntime: c.runtimeVersion?.policy === "fingerprint",
            updateProject: c.extra?.eas?.projectId === expectedProject,
            updateUrl: c.updates?.url === "https://u.expo.dev/" + expectedProject,
            automaticOta: c.updates?.checkAutomatically === "ON_LOAD"
          };
          for (const [name, ok] of Object.entries(checks)) console.log((ok ? "PASS " : "FAIL ") + name);
          if (Object.values(checks).some(ok => !ok)) process.exit(1);
          NODE
          npx --yes eas-cli@latest build --platform android --profile dev-apk --message "AFCON360 User development APK ${GITHUB_SHA}" --freeze-credentials --wait --json > "$RUNNER_TEMP/afcon360-user-dev-eas-build.json"
          node - "$RUNNER_TEMP/afcon360-user-dev-eas-build.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const builds = Array.isArray(value) ? value : [value];
          const build = builds.find(item => String(item.platform).toUpperCase() === "ANDROID") || builds[0];
          if (!build?.id || String(build.status).toUpperCase() !== "FINISHED") {
            throw new Error("EAS did not finish the signed User development APK build.");
          }
          console.log("build_id=" + build.id);
          NODE

      - name: Download signed User development APK from EAS
        if: steps.validate-dev-apk.outputs.reusable != 'true'
        working-directory: mobile/apps/user
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest build:view "${{ steps.eas-build.outputs.build_id }}" --json > "$RUNNER_TEMP/afcon360-user-dev-build-details.json"
          node - "$RUNNER_TEMP/afcon360-user-dev-build-details.json" > "$RUNNER_TEMP/afcon360-user-dev-apk-url.txt" <<'NODE'
          const fs = require("node:fs");
          const d = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const b = d.build || d;
          const u = b.artifacts?.buildUrl;
          if (!u || !u.startsWith("https://")) throw new Error("EAS build has no HTTPS APK artifact URL.");
          process.stdout.write(u);
          NODE
          APK_PATH="$GITHUB_WORKSPACE/user-dev-apk-cache/user-development.apk"
          mkdir -p "$(dirname "$APK_PATH")"
          curl --fail --location --retry 3 --retry-delay 2 "$(cat "$RUNNER_TEMP/afcon360-user-dev-apk-url.txt")" --output "$APK_PATH"
          test -s "$APK_PATH"

      - name: Install Android build tools for signed APK verification
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "build-tools;37.0.0"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Verify signed developer APK and record cache metadata
        id: verify-dev-apk
        working-directory: .
        shell: bash
        env:
          EXPECTED_FINGERPRINT: ${{ steps.dev-apk-key.outputs.fingerprint }}
          EXPECTED_PROFILE_SHA256: ${{ steps.dev-apk-key.outputs.profile_sha256 }}
          EXPECTED_VERSION_NAME: ${{ steps.dev-apk-key.outputs.version_name }}
          USER_DEV_APK_CACHE_KEY: ${{ steps.dev-apk-key.outputs.key }}
          CACHE_REUSED: ${{ steps.validate-dev-apk.outputs.reusable }}
        run: |
          set -euo pipefail
          APK="user-dev-apk-cache/user-development.apk"
          INFO="user-dev-apk-cache/build-info.txt"
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/afcon360-user-dev-signature.txt"
          aapt dump badging "$APK" > "$RUNNER_TEMP/afcon360-user-dev-badging.txt"
          BADGING="$RUNNER_TEMP/afcon360-user-dev-badging.txt"
          grep -F "package: name='space.pamoja.afcon360.user.preview'" "$BADGING"
          VERSION_NAME="$(sed -n "s/^package:.*versionName:'\\([^']*\\)'.*/\\1/p" "$BADGING" | head -n 1)"
          VERSION_CODE="$(sed -n "s/^package:.*versionCode:'\\([^']*\\)'.*/\\1/p" "$BADGING" | head -n 1)"
          MINIMUM="$(sed -n "s/.*sdkVersion:'\\([0-9]*\\)'.*/\\1/p" "$BADGING" | head -n 1)"
          TARGET="$(sed -n "s/.*targetSdkVersion:'\\([0-9]*\\)'.*/\\1/p" "$BADGING" | head -n 1)"
          test "$VERSION_NAME" = "$EXPECTED_VERSION_NAME"
          test -n "$VERSION_CODE" && test "$VERSION_CODE" -ge 1
          test "$MINIMUM" = "24"
          test -n "$TARGET" && test "$TARGET" -ge 36
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/afcon360-user-dev-signature.txt" | head -n 1)"
          test -n "$CERT_SHA256"
          APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          if [ "$CACHE_REUSED" = "true" ]; then
            grep -Fxq "signing_certificate_sha256=$CERT_SHA256" "$INFO"
            grep -Fxq "apk_sha256=$APK_SHA256" "$INFO"
          else
            {
              echo "app=user"
              echo "package=space.pamoja.afcon360.user.preview"
              echo "version_name=$VERSION_NAME"
              echo "version_code=$VERSION_CODE"
              echo "min_sdk=$MINIMUM"
              echo "target_sdk=$TARGET"
              echo "signing_certificate_sha256=$CERT_SHA256"
              echo "api=https://www.pamoja.space"
              echo "update_channel=user-development"
              echo "native_fingerprint=$EXPECTED_FINGERPRINT"
              echo "profile_sha256=$EXPECTED_PROFILE_SHA256"
              echo "cache_key=$USER_DEV_APK_CACHE_KEY"
              echo "source_commit=$GITHUB_SHA"
              echo "apk_sha256=$APK_SHA256"
            } > "$INFO"
          fi
          echo "$APK_SHA256" | tee user-dev-apk-cache/user-development.apk.sha256
          mkdir -p "$GITHUB_WORKSPACE/user-dev-apk-artifact"
          cp "$APK" "$GITHUB_WORKSPACE/user-dev-apk-artifact/afcon360-user-development.apk"
          cp "$INFO" "$GITHUB_WORKSPACE/user-dev-apk-artifact/afcon360-user-development-build-info.txt"
          cp user-dev-apk-cache/user-development.apk.sha256 "$GITHUB_WORKSPACE/user-dev-apk-artifact/afcon360-user-development.apk.sha256"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "cache_reused=$CACHE_REUSED" >> "$GITHUB_OUTPUT"
          echo "Signed User development APK verified (cache_reused=$CACHE_REUSED): $APK_SHA256"

      - name: Persist signed developer APK under native fingerprint key
        if: steps.validate-dev-apk.outputs.reusable != 'true'
        uses: actions/cache/save@v5
        with:
          path: user-dev-apk-cache/
          key: ${{ steps.dev-apk-key.outputs.key }}

      - name: Upload signed User development APK
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-user-development-apk-${{ github.run_number }}
          path: user-dev-apk-artifact/
          if-no-files-found: error
          retention-days: 90

      - name: Publish current User bundle to the isolated development OTA channel
        if: needs.classify-user-changes.outputs.ota == 'true'
        working-directory: mobile/apps/user
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          AFCON360_PREVIEW_BUILD: "true"
          AFCON360_RELEASE_BUILD: "false"
          AFCON360_UPDATE_CHANNEL: "user-development"
          EXPO_PUBLIC_API_BASE_URL: https://www.pamoja.space
          EXPO_NO_TELEMETRY: "1"
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL="user-development"
          npx --yes eas-cli@latest channel:edit "$CHANNEL" --branch "$CHANNEL" --non-interactive
          npx --yes eas-cli@latest update \
            --branch "$CHANNEL" \
            --environment preview \
            --platform android \
            --message "AFCON360 User development OTA ${GITHUB_SHA}" \
            --non-interactive
          echo "Published the tested feature bundle to the installable User development channel, separate from preview/release."
