name: Mobile workspace CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "mobile/**"
      - "app/__init__.py"
      - "templates/base.html"
      - "templates/mobile_apps/**"
      - ".github/workflows/mobile-workspace.yml"
  push:
    branches: ["**"]
    paths:
      - "mobile/**"
      - "app/__init__.py"
      - "templates/base.html"
      - "templates/mobile_apps/**"
      - ".github/workflows/mobile-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-syntax:
    name: Flask mobile API syntax and template parsing
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile mobile auth and API modules
        run: |
          python -m py_compile \
            app/__init__.py \
            app/auth/sessions.py \
            app/auth/mobile_tokens.py \
            app/auth/mobile_api.py \
            app/auth/account_deletion_service.py

      - name: Parse native app website templates
        run: |
          python -m pip install --disable-pip-version-check jinja2
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env = Environment()
          for path in sorted(Path("templates/mobile_apps").glob("*.html")):
              env.parse(path.read_text(encoding="utf-8"))
              print("JINJA_PARSE_OK", path)
          PY

  mobile-typecheck:
    name: Expo dependency and TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check Expo SDK dependency compatibility
        run: |
          pnpm --filter @afcon360/user-app exec expo install --check
          pnpm --filter @afcon360/driver-app exec expo install --check

      - name: Type-check both native applications
        run: pnpm typecheck

      - name: Bundle User app for Android and iOS
        run: |
          pnpm --filter @afcon360/user-app exec expo export --platform android --output-dir /tmp/afcon360-user-android
          pnpm --filter @afcon360/user-app exec expo export --platform ios --output-dir /tmp/afcon360-user-ios

      - name: Bundle Driver app for Android and iOS
        run: |
          pnpm --filter @afcon360/driver-app exec expo export --platform android --output-dir /tmp/afcon360-driver-android
          pnpm --filter @afcon360/driver-app exec expo export --platform ios --output-dir /tmp/afcon360-driver-ios
