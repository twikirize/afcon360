name: Mobile workspace CI

on:
  push:
    branches:
      - feat/native-user-app-integration-20261108
      - fix/native-user-apk-cache-and-e2e-20261110
    paths:
      - "mobile/apps/user/**"
      - "mobile/packages/**"
      - "mobile/scripts/**"
      - "mobile/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/pnpm-workspace.yaml"
      - "mobile/.npmrc"
      - ".github/workflows/mobile-workspace.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [feat/native-user-app-integration-20261108]
    paths:
      - "mobile/apps/user/**"
      - "mobile/packages/**"
      - "mobile/scripts/**"
      - "mobile/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/pnpm-workspace.yaml"
      - "mobile/.npmrc"
      - ".github/workflows/mobile-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-typecheck:
    name: Expo dependency and TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check approved website handoffs and native account deletion
        run: pnpm navigation:check

      - name: Check User app Expo SDK dependency compatibility
        run: pnpm --filter @afcon360/user-app exec expo install --check

      - name: Type-check User application
        run: pnpm user:typecheck

      - name: Bundle User app for Android and iOS
        run: |
          pnpm --filter @afcon360/user-app exec expo export --platform android --output-dir /tmp/afcon360-user-android
          pnpm --filter @afcon360/user-app exec expo export --platform ios --output-dir /tmp/afcon360-user-ios

  user-authenticated-journey:
    name: User APK — login, protected journeys, restore and logout
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afcon360_mobile_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afcon360_mobile_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: local
      FLASK_ENV: testing
      SECRET_KEY: "ci-only-not-a-production-secret"
      SECURITY_SALT: "ci-only-security-salt-value-long-enough-for-tests-2026"
      ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
      REFUND_POLICY_SIGNING_KEY: "ci-only-refund-policy-signing-key-not-production"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afcon360_mobile_e2e_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/afcon360_mobile_e2e_test
      REDIS_URL: redis://localhost:6379/15
      DISABLE_REDIS: "0"
      SOCKETIO_ENABLED: "false"
      ANALYTICS_ENABLED: "false"
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
      MAIL_SUPPRESS_SEND: "true"
      AFCON360_E2E_USERNAME: native_e2e_user
      AFCON360_E2E_EMAIL: native-e2e@afcon360.test
      AFCON360_E2E_PASSWORD: NativeE2ePassword2026
      AFCON360_E2E_EVIDENCE_DIR: mobile-e2e-evidence
      AFCON360_E2E_REQUEST_LOG: mobile-e2e-evidence/backend-requests.tsv
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Prepare User APK cache directory
        run: mkdir -p mobile-e2e-cache
      - name: Restore source-keyed User E2E APK
        id: user-apk-cache
        uses: actions/cache@v4
        with:
          path: mobile-e2e-cache/
          key: afcon360-user-e2e-apk-v1-${{ hashFiles('mobile/apps/user/**', 'mobile/packages/**', 'mobile/package.json', 'mobile/pnpm-lock.yaml', 'mobile/pnpm-workspace.yaml', 'mobile/.npmrc') }}
      - name: Prepare disposable backend with native Events and Accommodation APIs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin test/native-user-services-api-e2e-20261109
          git worktree add --detach "$RUNNER_TEMP/afcon360-services-backend" FETCH_HEAD
          test -f "$RUNNER_TEMP/afcon360-services-backend/app/accommodation/services/native_booking_service.py"
          test -f "$RUNNER_TEMP/afcon360-services-backend/app/events/native_event_service.py"
          echo "Prepared API overlay for E2E only; the User app source remains checked out from this PR."
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Flask backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build a fresh disposable PostgreSQL schema
        working-directory: ${{ runner.temp }}/afcon360-services-backend
        run: python -m flask --app 'app:create_app()' db upgrade
      - name: Seed one synthetic, non-MFA AFCON360 User
        env:
          AFCON360_E2E_BACKEND_ROOT: ${{ runner.temp }}/afcon360-services-backend
        run: python mobile/scripts/mobile-user-e2e-backend.py seed
      - name: Start isolated Flask API and wait for health
        shell: bash
        env:
          AFCON360_E2E_BACKEND_ROOT: ${{ runner.temp }}/afcon360-services-backend
        run: |
          set -euo pipefail
          mkdir -p mobile-e2e-evidence
          nohup python mobile/scripts/mobile-user-e2e-backend.py serve > mobile-e2e-evidence/backend.log 2>&1 < /dev/null &
          echo $! > mobile-e2e-evidence/backend.pid
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:5000/api/health/ping >/dev/null; then
              echo "Disposable AFCON360 API is healthy."
              exit 0
            fi
            sleep 2
          done
          cat mobile-e2e-evidence/backend.log
          echo "::error::Disposable AFCON360 API did not become healthy."
          exit 1
      - name: Set up Node.js
        if: steps.user-apk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
      - name: Set up pnpm
        if: steps.user-apk-cache.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false
      - name: Set up Java
        if: steps.user-apk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install User app workspace dependencies
        if: steps.user-apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile
      - name: Check User app Expo dependency compatibility
        if: steps.user-apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: pnpm --filter "@afcon360/user-app" exec expo install --check
      - name: Install Android platform and build tools
        if: steps.user-apk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
      - name: Generate a fresh User APK pointing only to the disposable local API
        if: steps.user-apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        env:
          AFCON360_PREVIEW_BUILD: "true"
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:5000
        run: pnpm --filter "@afcon360/user-app" exec expo prebuild --platform android --no-install --clean
      - name: Allow loopback HTTP only in this disposable E2E APK
        if: steps.user-apk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          manifest = Path("mobile/apps/user/android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          if not re.search(r"\bxmlns:android\s*=", source[:2000]):
              raise SystemExit("Generated Android manifest is missing its android namespace declaration.")
          app_tag = re.search(r"<application\b[^>]*>", source, flags=re.DOTALL)
          if app_tag is None:
              raise SystemExit("Generated Android manifest has no application element.")
          opening = app_tag.group(0)
          if re.search(r"\bandroid:usesCleartextTraffic\s*=", opening):
              opening = re.sub(
                  r"\bandroid:usesCleartextTraffic\s*=\s*[\"'][^\"']*[\"']",
                  'android:usesCleartextTraffic="true"',
                  opening,
              )
          else:
              opening = opening[:-1] + ' android:usesCleartextTraffic="true">'
          source = source[:app_tag.start()] + opening + source[app_tag.end():]
          ET.fromstring(source)
          manifest.write_text(source, encoding="utf-8")
          print("Loopback HTTP enabled only in the temporary test APK.")
          PY
      - name: Configure ephemeral release signing
        if: steps.user-apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "apps/user/android/app/build.gradle";
          let source = fs.readFileSync(path, "utf8");
          const buildTypes = source.indexOf("buildTypes {");
          const release = source.indexOf("release {", buildTypes);
          if (buildTypes < 0 || release < 0) throw new Error("Could not find Android release build type");
          const open = source.indexOf("{", release);
          let depth = 0;
          let end = -1;
          for (let i = open; i < source.length; i++) {
            if (source[i] === "{") depth++;
            if (source[i] === "}") {
              depth--;
              if (depth === 0) { end = i + 1; break; }
            }
          }
          if (end < 0) throw new Error("Could not find end of Android release build type");
          let block = source.slice(release, end);
          const signing = /signingConfig\s+signingConfigs\.[A-Za-z0-9_]+/;
          if (signing.test(block)) block = block.replace(signing, "signingConfig signingConfigs.debug");
          else block = block.replace("release {", "release {\n            signingConfig signingConfigs.debug");
          source = source.slice(0, release) + block + source.slice(end);
          fs.writeFileSync(path, source);
          NODE
      - name: Build isolated User release APK
        if: steps.user-apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile/apps/user/android
        run: ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Save fresh APK under the source-keyed cache key
        if: steps.user-apk-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          USER_APK_CACHE_KEY: afcon360-user-e2e-apk-v1-${{ hashFiles('mobile/apps/user/**', 'mobile/packages/**', 'mobile/package.json', 'mobile/pnpm-lock.yaml', 'mobile/pnpm-workspace.yaml', 'mobile/.npmrc') }}
        run: |
          set -euo pipefail
          APK="$(find mobile/apps/user/android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -s "$APK"
          mkdir -p mobile-e2e-cache
          cp "$APK" mobile-e2e-cache/user-e2e.apk
          APK_SHA256="$(sha256sum mobile-e2e-cache/user-e2e.apk | awk '{print $1}')"
          aapt dump badging mobile-e2e-cache/user-e2e.apk | grep -F "space.pamoja.afcon360.user.preview"
          cat > mobile-e2e-cache/build-info.txt <<EOF
          app=user
          package=space.pamoja.afcon360.user.preview
          api_origin=http://127.0.0.1:5000
          source_commit=$GITHUB_SHA
          cache_key=$USER_APK_CACHE_KEY
          apk_sha256=$APK_SHA256
          EOF
      - name: Stage and verify cached User APK for this journey
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile-e2e-cache/user-e2e.apk"
          INFO="mobile-e2e-cache/build-info.txt"
          test -s "$APK"
          test -s "$INFO"
          EXPECTED_SHA="$(sed -n 's/^apk_sha256=//p' "$INFO" | head -n 1)"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          mkdir -p mobile-e2e-evidence
          cp "$APK" mobile-e2e-evidence/user-e2e.apk
          cp "$INFO" mobile-e2e-evidence/user-e2e-build-info.txt
          printf '%s  %s\n' "$ACTUAL_SHA" "user-e2e.apk" | tee mobile-e2e-evidence/user-e2e-apk.sha256
          echo "Verified reusable User APK (cache_hit=${{ steps.user-apk-cache.outputs.cache-hit }}): $ACTUAL_SHA"
          cat mobile-e2e-evidence/user-e2e-build-info.txt
      - name: Enable KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::This runner does not expose /dev/kvm; hardware acceleration is unavailable."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Install, authenticate, test services, restore session and sign out
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          disable-linux-hw-accel: false
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          emulator-boot-timeout: 600
          script: python mobile/scripts/verify-user-authenticated-journey.py
      - name: Verify server-side logout and protected API evidence
        if: always()
        env:
          AFCON360_E2E_BACKEND_ROOT: ${{ runner.temp }}/afcon360-services-backend
        run: python mobile/scripts/mobile-user-e2e-backend.py assert
      - name: Upload User Android journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-user-android-e2e-evidence
          path: mobile-e2e-evidence/
          if-no-files-found: warn
          retention-days: 90
