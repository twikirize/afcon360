name: Mobile workspace CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, feat/native-mobile-server-support-20261105, feat/native-mobile-apps-20261104]
    paths:
      - "mobile/apps/**"
      - "mobile/packages/**"
      - "mobile/scripts/**"
      - "mobile/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/pnpm-workspace.yaml"
      - "mobile/.npmrc"
      - ".github/workflows/mobile-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-typecheck:
    name: Expo dependency and TypeScript checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check approved website handoffs and native account deletion
        run: pnpm navigation:check

      - name: Check Expo SDK dependency compatibility
        run: |
          pnpm --filter @afcon360/user-app exec expo install --check
          pnpm --filter @afcon360/driver-app exec expo install --check

      - name: Type-check both native applications
        run: pnpm typecheck

      - name: Bundle User app for Android and iOS
        run: |
          pnpm --filter @afcon360/user-app exec expo export --platform android --output-dir /tmp/afcon360-user-android
          pnpm --filter @afcon360/user-app exec expo export --platform ios --output-dir /tmp/afcon360-user-ios

      - name: Bundle Driver app for Android and iOS
        run: |
          pnpm --filter @afcon360/driver-app exec expo export --platform android --output-dir /tmp/afcon360-driver-android
          pnpm --filter @afcon360/driver-app exec expo export --platform ios --output-dir /tmp/afcon360-driver-ios
