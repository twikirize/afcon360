name: AFCON360 Android preview APKs

on:
  push:
    branches:
      - feat/native-mobile-apps-20261104
    paths:
      - "mobile/**"
      - "app/auth/**"
      - "app/transport/**"
      - "app/__init__.py"
      - "templates/mobile_apps/**"
      - ".github/workflows/mobile-preview-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-preview-apks:
    name: Build internal User and Driver APKs
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_BASE_URL: https://www.pamoja.space
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install JavaScript workspace
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile

      - name: Check Expo SDK compatibility
        working-directory: mobile
        run: |
          pnpm --filter @afcon360/user-app exec expo install --check
          pnpm --filter @afcon360/driver-app exec expo install --check

      - name: Install Android platform and build tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Create internal preview signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=AFCON360,C=UG"

      - name: Prebuild User Android project
        working-directory: mobile
        run: pnpm --filter @afcon360/user-app exec expo prebuild --platform android --no-install --clean

      - name: Configure User preview build signing
        working-directory: mobile/apps/user/android
        run: |
          node <<'NODE'
          const fs = require("fs");
          const file = "app/build.gradle";
          let source = fs.readFileSync(file, "utf8");
          const buildTypes = source.indexOf("buildTypes {");
          const release = source.indexOf("release {", buildTypes);
          if (buildTypes < 0 || release < 0) throw new Error("Could not locate Android release buildType");
          const insertAt = release + "release {".length;
          source = source.slice(0, insertAt) + "\n            signingConfig signingConfigs.debug" + source.slice(insertAt);
          fs.writeFileSync(file, source);
          NODE
          grep -R -n "targetSdkVersion" build.gradle app/build.gradle || true

      - name: Build User standalone preview APK
        working-directory: mobile/apps/user/android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Sign User preview APK
        working-directory: mobile/apps/user/android
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          zipalign -p -f 4 "$APK" "$RUNNER_TEMP/user-aligned.apk"
          apksigner sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android \
            --key-pass pass:android --out "$GITHUB_WORKSPACE/mobile/release-user.apk" "$RUNNER_TEMP/user-aligned.apk"
          apksigner verify --verbose "$GITHUB_WORKSPACE/mobile/release-user.apk"

      - name: Prebuild Driver Android project
        working-directory: mobile
        run: pnpm --filter @afcon360/driver-app exec expo prebuild --platform android --no-install --clean

      - name: Configure Driver preview build signing
        working-directory: mobile/apps/driver/android
        run: |
          node <<'NODE'
          const fs = require("fs");
          const file = "app/build.gradle";
          let source = fs.readFileSync(file, "utf8");
          const buildTypes = source.indexOf("buildTypes {");
          const release = source.indexOf("release {", buildTypes);
          if (buildTypes < 0 || release < 0) throw new Error("Could not locate Android release buildType");
          const insertAt = release + "release {".length;
          source = source.slice(0, insertAt) + "\n            signingConfig signingConfigs.debug" + source.slice(insertAt);
          fs.writeFileSync(file, source);
          NODE
          grep -R -n "targetSdkVersion" build.gradle app/build.gradle || true

      - name: Build Driver standalone preview APK
        working-directory: mobile/apps/driver/android
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Sign Driver preview APK
        working-directory: mobile/apps/driver/android
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          zipalign -p -f 4 "$APK" "$RUNNER_TEMP/driver-aligned.apk"
          apksigner sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android \
            --key-pass pass:android --out "$GITHUB_WORKSPACE/mobile/release-driver.apk" "$RUNNER_TEMP/driver-aligned.apk"
          apksigner verify --verbose "$GITHUB_WORKSPACE/mobile/release-driver.apk"

      - name: Stage preview APKs and checksums
        run: |
          mkdir -p mobile/release
          cp mobile/release-user.apk mobile/release/AFCON360-User-preview.apk
          cp mobile/release-driver.apk mobile/release/AFCON360-Driver-preview.apk
          cd mobile/release
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload APK workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: afcon360-android-preview-apks
          path: mobile/release/*
          if-no-files-found: error
          retention-days: 90

      - name: Update stable internal preview tag
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = "tags/mobile-preview";
            try {
              await github.rest.git.getRef({ owner, repo, ref });
              await github.rest.git.updateRef({
                owner, repo, ref, sha: context.sha, force: true
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: "refs/" + ref, sha: context.sha
              });
            }

      - name: Publish internal preview APK download links
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-preview
          target_commitish: ${{ github.sha }}
          name: AFCON360 internal Android preview
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            mobile/release/AFCON360-User-preview.apk
            mobile/release/AFCON360-Driver-preview.apk
            mobile/release/SHA256SUMS.txt
          body: |
            Internal tester distribution only.

            These are debug-signed Android preview APKs. They are directly installable for testing, but are not production-signed Google Play releases and must not be submitted to Play Console. Android may require the tester to allow installation from the source used to download the file.

            Production Android requires a signed AAB and Play App Signing. iPhone installation requires a separate signed iOS build and Apple distribution process.
