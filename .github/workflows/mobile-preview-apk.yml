# Cross-platform mobile compatibility gate and Android preview distribution.
name: AFCON360 Mobile compatibility and Android preview builds

on:
  push:
    branches:
      - feat/native-mobile-apps-20261104
    paths:
      - "mobile/apps/**"
      - "mobile/packages/**"
      - "mobile/docs/**"
      - "mobile/README.md"
      - "mobile/AGENTS.md"
      - "mobile/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/pnpm-workspace.yaml"
      - "mobile/.npmrc"
      - ".github/workflows/mobile-preview-apk.yml"
  pull_request:
    branches:
      - feat/native-mobile-apps-20261104
    paths:
      - "mobile/apps/**"
      - "mobile/packages/**"
      - "mobile/docs/**"
      - "mobile/README.md"
      - "mobile/AGENTS.md"
      - "mobile/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/pnpm-workspace.yaml"
      - "mobile/.npmrc"
      - ".github/workflows/mobile-preview-apk.yml"
  workflow_dispatch:

concurrency:
  group: afcon360-android-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-preview-apk:
    name: Build ${{ matrix.app }} standalone APK
    # Keep this Android build on the tested Ubuntu 24.04 image until Ubuntu 26.04 is validated.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: user
            package: space.pamoja.afcon360.user
          - app: driver
            package: space.pamoja.afcon360.driver
    env:
      APP: ${{ matrix.app }}
      EXPECTED_PACKAGE: ${{ matrix.package }}
      EXPO_PUBLIC_API_BASE_URL: https://www.pamoja.space
      AFCON360_PREVIEW_KEYSTORE_BASE64: ${{ secrets.AFCON360_PREVIEW_KEYSTORE_BASE64 }}
      AFCON360_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.AFCON360_PREVIEW_KEYSTORE_PASSWORD }}
      AFCON360_PREVIEW_KEY_ALIAS: ${{ secrets.AFCON360_PREVIEW_KEY_ALIAS }}
      AFCON360_PREVIEW_KEY_PASSWORD: ${{ secrets.AFCON360_PREVIEW_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install app workspace dependencies
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile

      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: pnpm --filter "@afcon360/${{ matrix.app }}-app" exec expo install --check

      - name: Install Android platform and build tools
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null
          # Android SDK Manager currently publishes API 37 as android-37.0,
          # while Gradle's compileSdkVersion 37 lookup expects android-37.
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Load stable internal preview signing key
        run: |
          for name in AFCON360_PREVIEW_KEYSTORE_BASE64 AFCON360_PREVIEW_KEYSTORE_PASSWORD AFCON360_PREVIEW_KEY_ALIAS AFCON360_PREVIEW_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              echo "Configure the four AFCON360_PREVIEW_KEYSTORE_* secrets documented in mobile/docs/store-submission-checklist.md."
              exit 1
            fi
          done
          mkdir -p "$HOME/.android"
          printf '%s' "$AFCON360_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/afcon360-preview.keystore"
          test -s "$HOME/.android/afcon360-preview.keystore"
          keytool -list -keystore "$HOME/.android/afcon360-preview.keystore" \
            -storepass "$AFCON360_PREVIEW_KEYSTORE_PASSWORD" \
            -alias "$AFCON360_PREVIEW_KEY_ALIAS" >/dev/null

      - name: Generate native Android project
        working-directory: mobile
        run: pnpm --filter "@afcon360/${{ matrix.app }}-app" exec expo prebuild --platform android --no-install --clean

      - name: Configure internal preview signing
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "apps/" + process.env.APP + "/android/app/build.gradle";
          let source = fs.readFileSync(path, "utf8");
          const buildTypes = source.indexOf("buildTypes {");
          const release = source.indexOf("release {", buildTypes);
          if (buildTypes < 0 || release < 0) throw new Error("Could not find Android release build type");
          const open = source.indexOf("{", release);
          let depth = 0;
          let end = -1;
          for (let i = open; i < source.length; i++) {
            if (source[i] === "{") depth++;
            if (source[i] === "}") {
              depth--;
              if (depth === 0) { end = i + 1; break; }
            }
          }
          if (end < 0) throw new Error("Could not find end of Android release build type");
          let block = source.slice(release, end);
          const signing = /signingConfig\s+signingConfigs\.[A-Za-z0-9_]+/;
          if (signing.test(block)) {
            block = block.replace(signing, "signingConfig signingConfigs.debug");
          } else {
            block = block.replace("release {", "release {\n            signingConfig signingConfigs.debug");
          }
          source = source.slice(0, release) + block + source.slice(end);
          fs.writeFileSync(path, source);
          NODE

      - name: Build standalone release APK
        working-directory: mobile
        run: cd "apps/$APP/android" && ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Sign and verify APK package, SDK and payload
        working-directory: mobile
        run: |
          APK="$(find "apps/$APP/android/app/build/outputs/apk/release" -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          mkdir -p release
          zipalign -p -f 4 "$APK" "$RUNNER_TEMP/$APP-aligned.apk"
          apksigner sign --ks "$HOME/.android/afcon360-preview.keystore" \
            --ks-pass env:AFCON360_PREVIEW_KEYSTORE_PASSWORD \
            --ks-key-alias "$AFCON360_PREVIEW_KEY_ALIAS" \
            --key-pass env:AFCON360_PREVIEW_KEY_PASSWORD \
            --out "release/$APP-preview.apk" "$RUNNER_TEMP/$APP-aligned.apk"
          FINAL_APK="$GITHUB_WORKSPACE/mobile/release/$APP-preview.apk"
          apksigner verify --verbose "$FINAL_APK"
          BADGING="$(aapt dump badging "$FINAL_APK")"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          MINIMUM="$(printf '%s\n' "$BADGING" | sed -n "s/.*sdkVersion:'\([0-9]*\)'.*/\1/p" | head -n 1)"
          TARGET="$(printf '%s\n' "$BADGING" | sed -n "s/.*targetSdkVersion:'\([0-9]*\)'.*/\1/p" | head -n 1)"
          test "$PACKAGE" = "$EXPECTED_PACKAGE"
          test "$MINIMUM" = "24"
          test -n "$TARGET" && test "$TARGET" -ge 36
          echo "Verified $APP APK package=$PACKAGE minSdkVersion=$MINIMUM targetSdkVersion=$TARGET"
          unzip -l "$FINAL_APK" > "$RUNNER_TEMP/$APP-apk-contents.txt"
          grep -q 'classes.dex' "$RUNNER_TEMP/$APP-apk-contents.txt"

      - name: Upload verified app APK
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-${{ matrix.app }}-preview-apk
          path: mobile/release/${{ matrix.app }}-preview.apk
          if-no-files-found: error
          retention-days: 90

  android-compatibility:
    name: Android API ${{ matrix.api-level }} / ${{ matrix.app }} install and launch
    needs: build-preview-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: user
            package: space.pamoja.afcon360.user
            api-level: 24
          - app: user
            package: space.pamoja.afcon360.user
            api-level: 29
          - app: user
            package: space.pamoja.afcon360.user
            api-level: 33
          - app: user
            package: space.pamoja.afcon360.user
            api-level: 36
          - app: driver
            package: space.pamoja.afcon360.driver
            api-level: 24
          - app: driver
            package: space.pamoja.afcon360.driver
            api-level: 29
          - app: driver
            package: space.pamoja.afcon360.driver
            api-level: 33
          - app: driver
            package: space.pamoja.afcon360.driver
            api-level: 36
    env:
      APP: ${{ matrix.app }}
      EXPECTED_PACKAGE: ${{ matrix.package }}
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: afcon360-${{ matrix.app }}-preview-apk
          path: release

      - name: Install and launch on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          # Keep this as one command: android-emulator-runner executes each script line in a new shell.
          script: bash mobile/scripts/verify-android-emulator-install.sh "$APP" "$EXPECTED_PACKAGE" "${{ matrix.api-level }}"

  ios-compatibility:
    name: iOS 16.4 minimum / current simulator / ${{ matrix.app }}
    # Use the x64 macOS 26 pool to avoid ARM64 hosted-runner allocation failures.
    runs-on: macos-26-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: user
            bundle-id: space.pamoja.afcon360.user
          - app: driver
            bundle-id: space.pamoja.afcon360.driver
    env:
      APP: ${{ matrix.app }}
      EXPECTED_BUNDLE_ID: ${{ matrix.bundle-id }}
      EXPO_PUBLIC_API_BASE_URL: https://www.pamoja.space
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Confirm supported Xcode toolchain
        run: |
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk '/^Xcode / {print $2; exit}')"
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          test "$XCODE_MAJOR" -ge 26

      - name: Install app workspace dependencies
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile

      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: pnpm --filter "@afcon360/${{ matrix.app }}-app" exec expo install --check

      - name: Generate native iOS project and install Pods
        working-directory: mobile
        run: pnpm --filter "@afcon360/${{ matrix.app }}-app" exec expo prebuild --platform ios --clean

      - name: Build, install and launch on current iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          IOS_DIR="$GITHUB_WORKSPACE/mobile/apps/$APP/ios"
          WORKSPACE="$(find "$IOS_DIR" -maxdepth 2 -type d -name '*.xcworkspace' ! -path '*/Pods/*' -print -quit)"
          test -n "$WORKSPACE"

          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              const schemes = data.workspace && data.workspace.schemes || [];
              if (!schemes.length) process.exit(2);
              process.stdout.write(schemes[0]);
            });
          ')"
          test -n "$SCHEME"

          SIMULATOR_UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "SimRuntime.iOS-26-4" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append(device["udid"])
          if not candidates:
              raise SystemExit("No available iOS 26.4 iPhone simulator found on macos-26.")
          print(candidates[0])
          ')"

          xcrun simctl boot "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

          DERIVED_DATA="$RUNNER_TEMP/afcon360-ios-derived-data"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          MIN_IOS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$MIN_IOS" = "16.4"
          test "$BUNDLE_ID" = "$EXPECTED_BUNDLE_ID"

          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl launch "$SIMULATOR_UDID" "$EXPECTED_BUNDLE_ID"
          echo "PASS: $APP installed and launched on iOS 26.4; deployment minimum is iOS $MIN_IOS."

  publish-preview:
    name: Publish verified User and Driver APKs
    needs: [build-preview-apk, android-compatibility, ios-compatibility]
    if: needs.build-preview-apk.result == 'success' && needs.android-compatibility.result == 'success' && needs.ios-compatibility.result == 'success' && github.event_name != 'pull_request'
    # Keep preview publication on Ubuntu 24.04 until Ubuntu 26.04 is validated.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare release directory
        run: mkdir -p mobile/release

      - name: Download User APK artifact
        uses: actions/download-artifact@v8
        with:
          name: afcon360-user-preview-apk
          path: mobile/release

      - name: Download Driver APK artifact
        uses: actions/download-artifact@v8
        with:
          name: afcon360-driver-preview-apk
          path: mobile/release

      - name: Name APKs and calculate checksums
        run: |
          mv mobile/release/user-preview.apk mobile/release/AFCON360-User-preview.apk
          mv mobile/release/driver-preview.apk mobile/release/AFCON360-Driver-preview.apk
          cd mobile/release
          sha256sum AFCON360-User-preview.apk AFCON360-Driver-preview.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Upload combined release artifact
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-android-preview-apks
          path: mobile/release/*
          if-no-files-found: error
          retention-days: 90

      - name: Confirm this build is still the branch head
        id: current
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.git.getRef({
              owner,
              repo,
              ref: "heads/feat/native-mobile-apps-20261104"
            });
            const isCurrent = response.data.object.sha === context.sha;
            core.setOutput("is_current", String(isCurrent));
            if (!isCurrent) {
              core.warning("A newer feature-branch commit exists; this APK will remain a workflow artifact and will not replace the public preview.");
            }

      - name: Update stable internal preview tag
        if: steps.current.outputs.is_current == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = "tags/mobile-preview";
            try {
              await github.rest.git.getRef({ owner, repo, ref });
              await github.rest.git.updateRef({
                owner, repo, ref, sha: context.sha, force: true
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner, repo, ref: "refs/" + ref, sha: context.sha
              });
            }

      - name: Publish internal preview APK download links
        if: steps.current.outputs.is_current == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mobile-preview
          target_commitish: ${{ github.sha }}
          name: AFCON360 internal Android preview
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            mobile/release/AFCON360-User-preview.apk
            mobile/release/AFCON360-Driver-preview.apk
            mobile/release/SHA256SUMS.txt
          body: |
            Internal tester distribution only.

            These are Android preview APKs signed with AFCON360's dedicated internal preview key. They are directly installable for testing, but are not signed with the production Play App Signing key and must not be submitted to Play Console. Android may require the tester to allow installation from the source used to download the file.

            Production Android requires a signed AAB and Play App Signing. iPhone installation requires a separate signed iOS build and Apple distribution process.
