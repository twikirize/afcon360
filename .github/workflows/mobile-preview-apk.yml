# PR-safe compatibility validation for both AFCON360 native apps.
# This workflow uses disposable CI signing and does not publish a GitHub Release.
name: AFCON360 Mobile Android and iOS compatibility

on:
  pull_request:
    branches:
      - feat/native-mobile-apps-20261104
    paths:
      - "mobile/apps/**"
      - "mobile/packages/**"
      - "mobile/docs/**"
      - "mobile/scripts/**"
      - "mobile/README.md"
      - "mobile/AGENTS.md"
      - "mobile/package.json"
      - "mobile/pnpm-lock.yaml"
      - "mobile/pnpm-workspace.yaml"
      - "mobile/.npmrc"
      - ".github/workflows/mobile-preview-apk.yml"
  workflow_dispatch:

concurrency:
  group: afcon360-mobile-platform-checks-${{ github.ref }}
  cancel-in-progress: false

# This PR-capable workflow never receives stable signing keys or write-capable tokens.
permissions:
  actions: read
  contents: read

jobs:
  detect-app-changes:
    name: Detect affected native clients
    runs-on: ubuntu-24.04
    outputs:
      apps_json: ${{ steps.detect.outputs.apps_json }}
      build_apps_json: ${{ steps.detect.outputs.build_apps_json }}
    steps:
      - name: Check out source history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select only changed native applications
        id: detect
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'apps_json=["user","driver"]' >> "$GITHUB_OUTPUT"
            echo 'build_apps_json=["user","driver"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          shared=false
          user=false
          driver=false

          if grep -Eq '^mobile/(packages/|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$|\.npmrc$)' <<< "$changed"; then
            shared=true
          fi
          if grep -Eq '^mobile/apps/user/' <<< "$changed"; then user=true; fi
          if grep -Eq '^mobile/apps/driver/' <<< "$changed"; then driver=true; fi

          if [[ "$shared" == "true" ]]; then
            user=true
            driver=true
          fi

          apps="["
          separator=""
          if [[ "$user" == "true" ]]; then
            apps+="$separator\"user\""
            separator=","
          fi
          if [[ "$driver" == "true" ]]; then
            apps+="$separator\"driver\""
          fi
          apps+="]"
          echo "apps_json=$apps" >> "$GITHUB_OUTPUT"
          echo "Affected native apps in the PR: $apps"

          # Only a native source/dependency change in this commit requires a
          # new platform compile. Test-harness-only commits reuse the cached APK.
          latest_changed="$(git diff --name-only "$HEAD_SHA^" "$HEAD_SHA")"
          build_shared=false
          build_user=false
          build_driver=false
          if grep -Eq '^mobile/(packages/|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$|\.npmrc$)' <<< "$latest_changed"; then
            build_shared=true
          fi
          if grep -Eq '^mobile/apps/user/' <<< "$latest_changed"; then build_user=true; fi
          if grep -Eq '^mobile/apps/driver/' <<< "$latest_changed"; then build_driver=true; fi
          if [[ "$build_shared" == "true" ]]; then
            build_user=true
            build_driver=true
          fi

          build_apps="["
          build_separator=""
          if [[ "$build_user" == "true" ]]; then
            build_apps+="$build_separator\"user\""
            build_separator=","
          fi
          if [[ "$build_driver" == "true" ]]; then
            build_apps+="$build_separator\"driver\""
          fi
          build_apps+="]"
          echo "build_apps_json=$build_apps" >> "$GITHUB_OUTPUT"
          echo "Apps requiring a fresh Android/iOS platform build: $build_apps"

  build-preview-apk:
    name: Build and verify ${{ matrix.app }} Android preview APK
    needs: detect-app-changes
    if: ${{ needs.detect-app-changes.outputs.build_apps_json != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-app-changes.outputs.build_apps_json) }}
    env:
      APP: ${{ matrix.app }}
      EXPECTED_PACKAGE: ${{ matrix.app == 'user' && 'space.pamoja.afcon360.user.preview' || 'space.pamoja.afcon360.driver.preview' }}
      AFCON360_PREVIEW_BUILD: "true"
      EXPO_PUBLIC_API_BASE_URL: https://www.pamoja.space
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Restore reusable unsigned Android preview APK
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk
          key: afcon360-${{ matrix.app }}-preview-v1-${{ runner.os }}-${{ hashFiles(format('mobile/apps/{0}/**', matrix.app), format('!mobile/apps/{0}/android/**', matrix.app), format('!mobile/apps/{0}/ios/**', matrix.app), format('!mobile/apps/{0}/node_modules/**', matrix.app), format('!mobile/apps/{0}/.expo/**', matrix.app), 'mobile/packages/**', 'mobile/package.json', 'mobile/pnpm-workspace.yaml', 'mobile/.npmrc') }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install app workspace dependencies
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile

      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: pnpm --filter "@afcon360/${{ matrix.app }}-app" exec expo install --check

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager not found"; exit 1; fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          # SDK Manager publishes API 37 as android-37.0, while Gradle expects android-37.
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Generate native Android project
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: pnpm --filter "@afcon360/${{ matrix.app }}-app" exec expo prebuild --platform android --no-install --clean

      - name: Configure temporary Android release signing
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "apps/" + process.env.APP + "/android/app/build.gradle";
          let source = fs.readFileSync(path, "utf8");
          const buildTypes = source.indexOf("buildTypes {");
          const release = source.indexOf("release {", buildTypes);
          if (buildTypes < 0 || release < 0) throw new Error("Could not find Android release build type");
          const open = source.indexOf("{", release);
          let depth = 0;
          let end = -1;
          for (let i = open; i < source.length; i++) {
            if (source[i] === "{") depth++;
            if (source[i] === "}") {
              depth--;
              if (depth === 0) { end = i + 1; break; }
            }
          }
          if (end < 0) throw new Error("Could not find end of Android release build type");
          let block = source.slice(release, end);
          const signing = /signingConfig\s+signingConfigs\.[A-Za-z0-9_]+/;
          if (signing.test(block)) {
            block = block.replace(signing, "signingConfig signingConfigs.debug");
          } else {
            block = block.replace("release {", "release {\n            signingConfig signingConfigs.debug");
          }
          source = source.slice(0, release) + block + source.slice(end);
          fs.writeFileSync(path, source);
          NODE

      - name: Build standalone release APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: cd "apps/$APP/android" && ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Save reusable unsigned Android preview APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/apps/${{ matrix.app }}/android/app/build/outputs/apk/release/app-release.apk
          key: afcon360-${{ matrix.app }}-preview-v1-${{ runner.os }}-${{ hashFiles(format('mobile/apps/{0}/**', matrix.app), format('!mobile/apps/{0}/android/**', matrix.app), format('!mobile/apps/{0}/ios/**', matrix.app), format('!mobile/apps/{0}/node_modules/**', matrix.app), format('!mobile/apps/{0}/.expo/**', matrix.app), 'mobile/packages/**', 'mobile/package.json', 'mobile/pnpm-workspace.yaml', 'mobile/.npmrc') }}

      - name: Sign and verify APK package, SDK and payload
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          # The short-lived signing key is created only inside this step.
          umask 077
          KEYSTORE="$RUNNER_TEMP/afcon360-ephemeral-ci.keystore"
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$KEYSTORE" -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -alias afcon360-ci -dname "CN=AFCON360 CI Test,O=Pamoja,C=UG" \
            -keyalg RSA -keysize 2048 -validity 2
          export AFCON360_SIGNING_KEYSTORE="$KEYSTORE"
          export AFCON360_SIGNING_STORE_PASSWORD="$PASSWORD"
          export AFCON360_SIGNING_KEY_ALIAS="afcon360-ci"
          export AFCON360_SIGNING_KEY_PASSWORD="$PASSWORD"
          AFCON360_SIGNING_KEY_TYPE="ephemeral-ci"
          APK="$(find "apps/$APP/android/app/build/outputs/apk/release" -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          mkdir -p release
          zipalign -p -f 4 "$APK" "$RUNNER_TEMP/$APP-aligned.apk"
          apksigner sign --ks "$AFCON360_SIGNING_KEYSTORE" \
            --ks-pass env:AFCON360_SIGNING_STORE_PASSWORD \
            --ks-key-alias "$AFCON360_SIGNING_KEY_ALIAS" \
            --key-pass env:AFCON360_SIGNING_KEY_PASSWORD \
            --out "release/$APP-preview.apk" "$RUNNER_TEMP/$APP-aligned.apk"
          FINAL_APK="$GITHUB_WORKSPACE/mobile/release/$APP-preview.apk"
          apksigner verify --verbose "$FINAL_APK"
          BADGING="$(aapt dump badging "$FINAL_APK")"
          PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          MINIMUM="$(printf '%s\n' "$BADGING" | sed -n "s/.*sdkVersion:'\([0-9]*\)'.*/\1/p" | head -n 1)"
          TARGET="$(printf '%s\n' "$BADGING" | sed -n "s/.*targetSdkVersion:'\([0-9]*\)'.*/\1/p" | head -n 1)"
          test "$PACKAGE" = "$EXPECTED_PACKAGE"
          test "$MINIMUM" = "24"
          test -n "$TARGET" && test "$TARGET" -ge 36
          echo "Verified $APP APK package=$PACKAGE minSdkVersion=$MINIMUM targetSdkVersion=$TARGET"
          unzip -l "$FINAL_APK" > "$RUNNER_TEMP/$APP-apk-contents.txt"
          grep -q 'classes.dex' "$RUNNER_TEMP/$APP-apk-contents.txt"

          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n 1)"
          if [ -n "$APKANALYZER" ]; then
            MANIFEST_XML="$("$APKANALYZER" manifest print "$FINAL_APK")"
            printf '%s\n' "$MANIFEST_XML" | grep -Eq 'android:allowBackup="false"'
          else
            MANIFEST_TREE="$(aapt dump xmltree "$FINAL_APK" AndroidManifest.xml)"
            printf '%s\n' "$MANIFEST_TREE" | grep -Eq 'android:allowBackup[^=]*=.*(false|0x0)'
          fi

          APK_SHA256="$(sha256sum "$FINAL_APK" | awk '{print $1}')"
          cat > "release/$APP-build-info.txt" <<EOF
          app=$APP
          package=$PACKAGE
          min_sdk=$MINIMUM
          target_sdk=$TARGET
          source_sha=$GITHUB_SHA
          build_run_id=$GITHUB_RUN_ID
          signing_key_type=$AFCON360_SIGNING_KEY_TYPE
          apk_sha256=$APK_SHA256
          EOF

      - name: Upload verified app APK
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-${{ matrix.app }}-preview-apk
          path: |
            mobile/release/${{ matrix.app }}-preview.apk
            mobile/release/${{ matrix.app }}-build-info.txt
          if-no-files-found: error
          retention-days: 90

  android-compatibility:
    name: Android API ${{ matrix.api-level }} / ${{ matrix.app }} install and launch
    needs: [detect-app-changes, build-preview-apk]
    if: ${{ needs.detect-app-changes.outputs.build_apps_json != '[]' && needs.build-preview-apk.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJSON(needs.detect-app-changes.outputs.build_apps_json) }}
        api-level: [24, 29, 33, 36]
    env:
      APP: ${{ matrix.app }}
      EXPECTED_PACKAGE: ${{ matrix.app == 'user' && 'space.pamoja.afcon360.user.preview' || 'space.pamoja.afcon360.driver.preview' }}
    steps:
      - name: Check out emulator verification script
        uses: actions/checkout@v7

      - name: Download this run's verified APK
        uses: actions/download-artifact@v8
        with:
          name: afcon360-${{ matrix.app }}-preview-apk
          path: release

      - name: Verify APK provenance and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="release/$APP-preview.apk"
          INFO="release/$APP-build-info.txt"
          test -s "$APK"
          test -s "$INFO"
          grep -Fxq "app=$APP" "$INFO"
          grep -Fxq "package=$EXPECTED_PACKAGE" "$INFO"
          grep -Fxq "build_run_id=$GITHUB_RUN_ID" "$INFO"
          EXPECTED_SHA="$(sed -n 's/^apk_sha256=//p' "$INFO" | head -n 1)"
          ACTUAL_SHA="$(sha256sum "$APK" | awk '{print $1}')"
          test -n "$EXPECTED_SHA" && test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          echo "Verified $APP APK from source commit $(sed -n 's/^source_sha=//p' "$INFO" | head -n 1)."

      - name: Enable and verify KVM hardware acceleration
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable; refusing a slow software-emulation fallback."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install and launch on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash mobile/scripts/verify-android-emulator-install.sh "$APP" "$EXPECTED_PACKAGE" "${{ matrix.api-level }}"

  apk-manifest-audit:
    name: Audit ${{ matrix.app }} APK permissions and components
    needs: [detect-app-changes, build-preview-apk]
    if: ${{ needs.detect-app-changes.outputs.build_apps_json != '[]' && needs.build-preview-apk.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-app-changes.outputs.build_apps_json) }}
    env:
      APP: ${{ matrix.app }}
      EXPECTED_PACKAGE: ${{ matrix.app == 'user' && 'space.pamoja.afcon360.user.preview' || 'space.pamoja.afcon360.driver.preview' }}
    steps:
      - name: Download this run's app APK
        uses: actions/download-artifact@v8
        with:
          name: afcon360-${{ matrix.app }}-preview-apk
          path: ${{ runner.temp }}/afcon360-${{ matrix.app }}-artifact

      - name: Inspect packaged manifest, permissions and signature
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1
          set -o pipefail
          "$SDKMANAGER" --install 'build-tools;37.0.0' >/dev/null
          AAPT="$SDK_ROOT/build-tools/37.0.0/aapt"
          APKSIGNER="$SDK_ROOT/build-tools/37.0.0/apksigner"
          APKANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer | sort | tail -n 1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -n "$APKANALYZER"

          ARTIFACT_DIR="$RUNNER_TEMP/afcon360-$APP-artifact"
          APK="$(find "$ARTIFACT_DIR" -type f -name '*.apk' -print -quit)"
          INFO="$(find "$ARTIFACT_DIR" -type f -name "$APP-build-info.txt" -print -quit)"
          test -s "$APK"
          test -s "$INFO"

          REPORT="$RUNNER_TEMP/afcon360-$APP-manifest-audit"
          mkdir -p "$REPORT"
          "$APKANALYZER" manifest print "$APK" > "$REPORT/AndroidManifest.xml"
          "$AAPT" dump permissions "$APK" > "$REPORT/permissions.txt"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$REPORT/manifest-tree.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$REPORT/signature.txt" 2>&1
          cp "$INFO" "$REPORT/build-info.txt"

          grep -Fxq "app=$APP" "$INFO"
          grep -Fxq "package=$EXPECTED_PACKAGE" "$INFO"
          grep -Eq 'android:allowBackup="false"' "$REPORT/AndroidManifest.xml"
          for permission in \
            android.permission.READ_EXTERNAL_STORAGE \
            android.permission.WRITE_EXTERNAL_STORAGE \
            android.permission.SYSTEM_ALERT_WINDOW; do
            if grep -Fq "$permission" "$REPORT/permissions.txt"; then
              echo "::error::$APP APK unexpectedly declares blocked permission: $permission"
              exit 1
            fi
          done
          if grep -Eq 'android:debuggable="true"|android:usesCleartextTraffic="true"' "$REPORT/AndroidManifest.xml"; then
            echo "::error::$APP APK enables debuggable mode or cleartext traffic."
            exit 1
          fi

          {
            echo "# AFCON360 $APP APK manifest audit"
            echo
            echo "## Build provenance"
            cat "$INFO"
            echo
            echo "## Declared permissions"
            cat "$REPORT/permissions.txt"
            echo
            echo "## Manifest security attributes"
            grep -E 'uses-permission|<activity|<activity-alias|<service|<receiver|<provider|android:(name|exported|permission|allowBackup|debuggable|usesCleartextTraffic|taskAffinity)' "$REPORT/AndroidManifest.xml" || true
            echo
            echo "## APK signing certificate"
            cat "$REPORT/signature.txt"
          } > "$REPORT/audit-summary.md"
          cat "$REPORT/audit-summary.md"

      - name: Upload manifest audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-${{ matrix.app }}-apk-manifest-audit
          path: ${{ runner.temp }}/afcon360-${{ matrix.app }}-manifest-audit/
          if-no-files-found: error
          retention-days: 30

  ios-compatibility:
    name: iOS 16.4 minimum / current simulator / ${{ matrix.app }}
    needs: detect-app-changes
    if: ${{ needs.detect-app-changes.outputs.build_apps_json != '[]' }}
    runs-on: macos-26-intel
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect-app-changes.outputs.build_apps_json) }}
    env:
      APP: ${{ matrix.app }}
      EXPECTED_BUNDLE_ID: ${{ matrix.app == 'user' && 'space.pamoja.afcon360.user' || 'space.pamoja.afcon360.driver' }}
      EXPO_PUBLIC_API_BASE_URL: https://www.pamoja.space
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Confirm Xcode 26.4 or later
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          MINIMUM_XCODE="26.4"
          LOWEST="$(printf '%s\n' "$MINIMUM_XCODE" "$XCODE_VERSION" | sort -V | head -n 1)"
          if [ "$LOWEST" != "$MINIMUM_XCODE" ]; then
            echo "::error::Expo SDK 58 needs Xcode 26.4 or later; found $XCODE_VERSION."
            exit 1
          fi

      - name: Install app workspace dependencies
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile

      - name: Check Expo dependency compatibility
        working-directory: mobile
        run: pnpm --filter "@afcon360/${{ matrix.app }}-app" exec expo install --check

      - name: Generate native iOS project and install Pods
        working-directory: mobile
        run: pnpm --filter "@afcon360/${{ matrix.app }}-app" exec expo prebuild --platform ios --clean

      - name: Build, install and launch on iOS 26.4 simulator
        shell: bash
        run: |
          set -euo pipefail
          IOS_DIR="$GITHUB_WORKSPACE/mobile/apps/$APP/ios"
          WORKSPACE="$(find "$IOS_DIR" -maxdepth 2 -type d -name '*.xcworkspace' ! -path '*/Pods/*' -print -quit)"
          test -n "$WORKSPACE"

          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | node -e '
            let input = "";
            process.stdin.on("data", chunk => input += chunk);
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              const schemes = data.workspace && data.workspace.schemes || [];
              if (!schemes.length) process.exit(2);
              process.stdout.write(schemes[0]);
            });
          ')"
          test -n "$SCHEME"

          SIMULATOR_UDID="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data.get("devices", {}).items():
              if "SimRuntime.iOS-26-4" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append(device["udid"])
          if not candidates:
              raise SystemExit("No available iOS 26.4 iPhone simulator found on macos-26-intel.")
          print(candidates[0])
          ')"

          # Start simulator migration while Xcode compiles for a generic iOS Simulator destination.
          xcrun simctl boot "$SIMULATOR_UDID"

          DERIVED_DATA="$RUNNER_TEMP/afcon360-$APP-ios-derived-data"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            build

          # Wait for first-boot LaunchServices migration only before installation.
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

          APP_PATH="$(find "$DERIVED_DATA/Build/Products/Debug-iphonesimulator" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          MIN_IOS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$MIN_IOS" = "16.4"
          test "$BUNDLE_ID" = "$EXPECTED_BUNDLE_ID"

          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl launch "$SIMULATOR_UDID" "$EXPECTED_BUNDLE_ID"
          echo "PASS: $APP installed and launched on iOS 26.4; deployment minimum is iOS $MIN_IOS."

  driver-authenticated-journey:
    name: Driver APK — real login, Driver workspace reads, session restore and logout
    # Authentication E2E is a deliberate final gate after Driver workspace parity; PR updates must not run it automatically.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/native-driver-workspace-parity-20261109' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afcon360_driver_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afcon360_driver_e2e_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: testing
      FLASK_ENV: testing
      SECRET_KEY: "ci-only-not-a-production-secret"
      SECURITY_SALT: "ci-only-security-salt-value-long-enough-for-driver-e2e-2026"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/afcon360_driver_e2e_test"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/afcon360_driver_e2e_test"
      REDIS_URL: "redis://127.0.0.1:6379/15"
      DISABLE_REDIS: "0"
      SOCKETIO_ENABLED: "false"
      ANALYTICS_ENABLED: "false"
      MAIL_SUPPRESS_SEND: "true"
      EXPO_PUBLIC_API_BASE_URL: "http://127.0.0.1:5000"
      AFCON360_PREVIEW_BUILD: "true"
      AFCON360_DRIVER_E2E_USERNAME: native_e2e_driver
      AFCON360_DRIVER_E2E_EMAIL: native-driver-e2e@afcon360.test
      AFCON360_DRIVER_E2E_PASSWORD: DriverE2ePassword2026
      AFCON360_NON_DRIVER_E2E_USERNAME: native_e2e_customer
      AFCON360_NON_DRIVER_E2E_EMAIL: native-customer-e2e@afcon360.test
      AFCON360_NON_DRIVER_E2E_PASSWORD: CustomerE2ePassword2026
      AFCON360_DRIVER_E2E_EVIDENCE_DIR: driver-e2e-evidence
      AFCON360_DRIVER_E2E_BACKEND_ROOT: ${{ github.workspace }}/backend-candidate
    steps:
      - name: Check out the Driver app source
        uses: actions/checkout@v7

      # The native app and its proposed backend contract live in separate PRs.
      # Test the APK from this PR against the consolidated backend candidate
      # instead of silently exercising the older backend base branch.
      - name: Check out consolidated Driver backend candidate
        uses: actions/checkout@v7
        with:
          repository: twikirize/afcon360
          ref: feat/driver-native-history-demand-api-20261110
          path: backend-candidate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend-candidate/requirements.txt

      - name: Build a fresh disposable PostgreSQL schema from the backend candidate
        working-directory: backend-candidate
        run: python -m flask --app 'app:create_app()' db upgrade

      - name: Seed a synthetic pending Driver and a customer-only identity
        run: python mobile/scripts/mobile-driver-e2e-backend.py seed

      - name: Start isolated Flask API and wait for health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p driver-e2e-evidence
          nohup python mobile/scripts/mobile-driver-e2e-backend.py serve > driver-e2e-evidence/backend.log 2>&1 < /dev/null &
          echo $! > driver-e2e-evidence/backend.pid

          for attempt in $(seq 1 90); do
            if curl --connect-timeout 2 --max-time 5 --silent --fail http://127.0.0.1:5000/api/health/ping >/dev/null; then
              echo "Disposable AFCON360 Driver API is healthy."
              exit 0
            fi
            if ! kill -0 "$(cat driver-e2e-evidence/backend.pid)" 2>/dev/null; then
              cat driver-e2e-evidence/backend.log
              echo "::error::The disposable Driver API process exited before becoming healthy."
              exit 1
            fi
            sleep 2
          done

          cat driver-e2e-evidence/backend.log
          echo "::error::Disposable AFCON360 Driver API did not become healthy."
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.4
          run_install: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install mobile workspace dependencies
        working-directory: mobile
        run: pnpm install --no-frozen-lockfile

      - name: Check Driver Expo dependency compatibility
        working-directory: mobile
        run: pnpm --filter "@afcon360/driver-app" exec expo install --check

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found."
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -s "$ANDROID_HOME/platforms/android-37/android.jar"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"

      - name: Generate Driver Android project for the isolated test API
        working-directory: mobile
        run: pnpm --filter "@afcon360/driver-app" exec expo prebuild --platform android --no-install --clean

      - name: Permit cleartext only in this disposable loopback test APK
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = "apps/driver/android/app/src/main/AndroidManifest.xml";
          let manifest = fs.readFileSync(path, "utf8");
          if (!/<application\b/.test(manifest)) {
            throw new Error("Generated Driver Android manifest has no application element.");
          }
          manifest = manifest.replace(/<application\b([^>]*)>/, (_match, attrs) => {
            const cleaned = attrs.replace(/\s+android:usesCleartextTraffic="[^"]*"/, "");
            return '<application' + cleaned + ' android:usesCleartextTraffic="true">';
          });
          fs.writeFileSync(path, manifest);
          if (!/android:usesCleartextTraffic="true"/.test(manifest)) {
            throw new Error("Could not enable loopback HTTP for the disposable test APK.");
          }
          NODE

      # This cache is keyed only by Driver application inputs, not this workflow or
      # the E2E/backend test scripts. Test-harness corrections therefore reuse the
      # same self-contained APK; changing Driver app code/dependencies invalidates it.
      - name: Restore reusable Driver E2E release APK
        id: driver-e2e-apk-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/apps/driver/android/app/build/outputs/apk/release/app-release.apk
          key: afcon360-driver-e2e-release-v2-${{ runner.os }}-${{ hashFiles('mobile/apps/driver/**', '!mobile/apps/driver/android/**', '!mobile/apps/driver/ios/**', '!mobile/apps/driver/node_modules/**', '!mobile/apps/driver/.expo/**', 'mobile/packages/**', 'mobile/package.json', 'mobile/pnpm-lock.yaml', 'mobile/pnpm-workspace.yaml', 'mobile/.npmrc') }}

      - name: Configure temporary signing for the standalone Driver E2E APK
        if: steps.driver-e2e-apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "apps/driver/android/app/build.gradle";
          let source = fs.readFileSync(path, "utf8");
          const buildTypes = source.indexOf("buildTypes {");
          const release = source.indexOf("release {", buildTypes);
          if (buildTypes < 0 || release < 0) throw new Error("Could not find Android release build type");
          const open = source.indexOf("{", release);
          let depth = 0;
          let end = -1;
          for (let i = open; i < source.length; i++) {
            if (source[i] === "{") depth++;
            if (source[i] === "}") {
              depth--;
              if (depth === 0) { end = i + 1; break; }
            }
          }
          if (end < 0) throw new Error("Could not find end of Android release build type");
          let block = source.slice(release, end);
          const signing = /signingConfig\s+signingConfigs\.[A-Za-z0-9_]+/;
          if (signing.test(block)) {
            block = block.replace(signing, "signingConfig signingConfigs.debug");
          } else {
            block = block.replace("release {", "release {\n            signingConfig signingConfigs.debug");
          }
          source = source.slice(0, release) + block + source.slice(end);
          fs.writeFileSync(path, source);
          NODE

      - name: Build self-contained Driver E2E release APK
        if: steps.driver-e2e-apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: cd apps/driver/android && ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Save reusable Driver E2E release APK
        if: steps.driver-e2e-apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/apps/driver/android/app/build/outputs/apk/release/app-release.apk
          key: afcon360-driver-e2e-release-v2-${{ runner.os }}-${{ hashFiles('mobile/apps/driver/**', '!mobile/apps/driver/android/**', '!mobile/apps/driver/ios/**', '!mobile/apps/driver/node_modules/**', '!mobile/apps/driver/.expo/**', 'mobile/packages/**', 'mobile/package.json', 'mobile/pnpm-lock.yaml', 'mobile/pnpm-workspace.yaml', 'mobile/.npmrc') }}

      - name: Verify and stage the standalone Driver E2E APK
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/apps/driver/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          unzip -l "$APK" | grep -F "assets/index.android.bundle"
          mkdir -p driver-e2e-evidence
          cp "$APK" driver-e2e-evidence/driver-e2e.apk
          aapt dump badging driver-e2e-evidence/driver-e2e.apk | grep -F "package: name='space.pamoja.afcon360.driver.preview'"
          sha256sum driver-e2e-evidence/driver-e2e.apk | tee driver-e2e-evidence/driver-e2e-apk.sha256
          echo "The standalone test APK embeds the Driver app bundle and points only to the disposable loopback API."

      - name: Enable and verify KVM hardware acceleration for authenticated Driver journey
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is unavailable; refusing a slow software-emulation fallback."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install, sign in, read Driver screens, restore session and sign out on Android
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          emulator-boot-timeout: 600
          script: python mobile/scripts/verify-driver-authenticated-journey.py

      - name: Verify Driver API evidence and server-side session revocation
        if: always()
        run: python mobile/scripts/mobile-driver-e2e-backend.py assert

      - name: Upload Driver screenshots and sanitized backend evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: afcon360-driver-authenticated-journey-evidence
          path: driver-e2e-evidence/
          if-no-files-found: warn
          retention-days: 30
