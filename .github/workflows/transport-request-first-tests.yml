name: Transport request-first PostgreSQL regression

on:
  push:
    branches:
      - fix/workspace-deep-links-test-baseline-20261102
  pull_request:
    branches: [main]
    paths:
      - "app/transport/**"
      - "app/wallet/**"
      - "app/geo/**"
      - "static/js/geo/**"
      - "static/js/modules/transport/**"
      - "static/offline.html"
      - "static/transport/sw.js"
      - "scripts/seed_payment_methods.py"
      - "app/tasks/transport_recovery.py"
      - "app/utils/validators.py"
      - "app/utils/module_toggle_service.py"
      - "app/config.py"
      - "tests/test_geo_integration.py"
      - "tests/test_module_integration.py"
      - "tests/test_*.py"
      - "tests/transport/**"
      - "app/__init__.py"
      - "templates/transport/**"
      - "templates/admin/transport_admin_*.html"
      - "tests/test_transport_booking_route_path.py"
      - "tests/test_transport_ride_options.py"
      - "tests/test_ui11_booking_flash_copy.py"
      - "tests/test_transport_request_tracker_copy.py"
      - "tests/test_transport_cash_confirmation_semantics.py"
      - "tests/test_transport_admin_canonical_overview.py"
      - "tests/transport/test_ride_request_create.py"
      - "tests/transport/test_trip_end_payment_semantics.py"
      - "tests/transport/test_wallet_invoice_boundary.py"
      - "tests/transport/test_location_lifecycle_booking_set.py"
      - "tests/transport/test_cancel_fee_scheduled_p1.py"
      - "tests/test_geo_realtime.py"
      - "tests/test_geo_foundation.py"
      - "tests/transport/test_driver_console.py"
      - "tests/test_driver_location_csrf_refresh.py"
      - "tests/test_transport_d2_evidence.py"
      - "tests/test_transport_pwa_shell.py"
      - "tests/test_transport_restful_auth.py"
      - "tests/test_transport_tracking_live.py"
      - "tests/test_transport_frontend_contracts.py"
      - "tests/wallet/**"
      - "tests/test_wallet_authorization_limits.py"
      - "tests/test_kyc_limit_authorization.py"
      - "tests/test_process_webhook_dead_letter.py"
      - "tests/test_dead_letter_alert.py"
      - "tests/test_payment_method_capabilities.py"
      - "tests/conftest.py"
      - "tests/helpers/**"
      - "scripts/ci/redis_socketio_runtime_smoke.py"
      - "scripts/ops/**"
      - "docs/release/**"
      - "tests/test_owner_mfa_security.py"
      - "tests/test_security_answer_hashing.py"
      - "tests/test_ui_20_csp.py"
      - "tests/test_csp_strict_flag.py"
      - "tests/test_mfa_secret_encryption.py"
      - "tests/test_deletion_guard.py"
      - "app/auth/deletion_guard.py"
      - "app/auth/security_policy.py"
      - "app/api/health.py"
      - "tests/test_health_rate_limit.py"
      - "app/auth/otp_service.py"
      - "app/models/system_config.py"
      - "env.example"
      - "templates/auth/**"
      - "app/auth/routes.py"
      - "app/auth/services.py"
      - "app/identity/models/user.py"
      - "app/profile/routes.py"
      - "app/utils/security.py"
      - "app/admin/owner/routes.py"
      - "templates/owner/settings.html"
      - "templates/auth/mfa_setup.html"
      - "templates/auth/mfa_status.html"
      - "tests/test_request_tracker_polling.cjs"
      - "tests/test_geo_realtime_fallback.cjs"
      - "tests/test_rider_sync_driver_card.cjs"
      - "migrations/**"
      - "requirements.txt"
      - ".github/workflows/transport-request-first-tests.yml"
  workflow_dispatch:
    inputs:
      test_scope:
        description: "Run only recorded failing tests, or the final full regression"
        required: true
        type: choice
        options:
          - failed_only
          - full_suite
        default: failed_only

permissions:
  contents: read

concurrency:
  group: transport-request-first-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-regression:
    name: PostgreSQL ${{ matrix.postgres-version }} — request lifecycle, payments, admin queues
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["15", "18"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: afcon360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d afcon360_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      APP_ENV: testing
      FLASK_ENV: testing
      DISABLE_REDIS: "1"
      SOCKETIO_ENABLED: "false"
      LOG_LEVEL: WARNING
      SECRET_KEY: "ci-only-not-a-production-secret"
      SECURITY_SALT: "ci-only-security-salt-value-long-enough-for-tests-2026"
      ENCRYPTION_KEY: "ci-only-not-a-production-key"
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/afcon360_test
      DATABASE_URL: postgresql://postgres@localhost:5432/afcon360_test
      TEST_DB_LOCK_TIMEOUT: "60"
      TEST_ISOLATION_TIMING: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure passwordless CI PostgreSQL authentication
        shell: bash
        run: |
          umask 077
          printf 'localhost:5432:afcon360_test:postgres:postgres\n' > "$HOME/.pgpass"
          chmod 600 "$HOME/.pgpass"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-timeout==2.4.0

      - name: Confirm one Alembic head
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          config = Config("migrations/alembic.ini")
          config.set_main_option("script_location", "migrations")
          heads = ScriptDirectory.from_config(config).get_heads()
          print("Alembic heads:", heads)
          if len(heads) != 1:
              raise SystemExit(
                  f"Expected exactly one Alembic head before test provisioning; found {len(heads)}"
              )
          PY

      # These source-level checks deliberately run before migration replay.
      # They can still report useful code/template failures when an unrelated
      # migration prevents the database-backed regression suite from starting.
      - name: Validate read-only Oracle release audit and SMTP diagnostic scripts
        run: |
          bash -n scripts/ops/pre_release_readonly_audit.sh
          python -m py_compile scripts/ops/send_smtp_test_email.py

      - name: Compile Python modules changed by the transport feature
        run: >-
          python -m compileall -q
          app/transport
          app/wallet
          app/geo
          scripts/seed_payment_methods.py
          app/tasks/transport_recovery.py
          app/tasks/transport_permission_purge.py
          app/transport/services/offer_service.py
          app/tasks/webhook_processor.py
          app/tasks/cleanup.py
          app/tasks/accommodation_reminders.py
          app/accommodation/services/availability_service.py
          app/notifications/tasks.py
          app/notifications/services.py
          app/notifications/events/tasks.py
          app/notifications/models.py
          app/events/tasks.py
          app/celery_app.py
          tests/test_celery_small_batch_contracts.py
          tests/notifications/test_scheduled_notification_delivery.py
          app/utils/validators.py
          tests/test_transport_booking_route_path.py
          tests/test_transport_ride_options.py
          tests/test_ui11_booking_flash_copy.py
          tests/test_transport_request_tracker_copy.py
          tests/test_transport_cash_confirmation_semantics.py
          tests/test_transport_admin_canonical_overview.py
          tests/transport/test_ride_request_create.py
          tests/transport/test_trip_end_payment_semantics.py
          tests/transport/test_wallet_invoice_boundary.py
          tests/transport/test_location_lifecycle_booking_set.py
          tests/transport/test_cancel_fee_scheduled_p1.py
          tests/test_geo_realtime.py
          tests/test_geo_foundation.py
          tests/transport/test_driver_console.py
          tests/test_driver_location_csrf_refresh.py
          tests/test_transport_d2_evidence.py
          tests/test_transport_pwa_shell.py
          tests/test_transport_restful_auth.py
          tests/test_transport_tracking_live.py
          tests/test_transport_frontend_contracts.py
          tests/test_owner_mfa_security.py
          tests/test_security_answer_hashing.py
          tests/test_mfa_secret_encryption.py
          tests/wallet
          tests/conftest.py
          tests/test_deletion_guard.py
          app/auth/deletion_guard.py
          app/auth/context.py
          app/auth/routes.py
          app/accommodation/routes.py
          app/identity/routes.py
          app/transport/routes.py
          app/auth/security_policy.py
          app/auth/otp_service.py
          app/auth/services.py
          app/identity/models/user.py
          app/profile/routes.py
          app/utils/security.py
          app/admin/owner/routes.py
          app/models/system_config.py
          app/api/health.py
          tests/test_health_rate_limit.py
          tests/test_auth_context.py
          tests/test_driver_workspace_consolidation.py
          tests/test_isolation_baseline.py
          tests/test_stage4b8_context_switch_e2e_proof.py
          tests/test_stage4b9_context_switch_nav_e2e.py
          tests/test_org_workspace.py
          tests/test_org_host_production_path.py
          tests/test_events_ownership_characterization.py

      - name: Validate Celery Docker entrypoint shell syntax
        run: bash -n docker-entrypoint.sh

      - name: Parse changed Jinja templates without database access
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader

          templates = (
              "transport/new_home.html",
              "transport/driver/driver_dashboard.html",
              "transport/rides/request_show.html",
              "transport/rides/show.html",
              "admin/transport_admin_dashboard.html",
              "admin/transport_admin_operations.html",
              "owner/settings.html",
              "auth/mfa_setup.html",
              "auth/mfa_status.html",
              "transport/admin/dashboard.html",
              "base.html",
              "transport/driver/base.html",
              "components/workspace_context_switcher.html",
          )
          env = Environment(
              loader=FileSystemLoader("templates"),
              extensions=["jinja2.ext.do", "jinja2.ext.loopcontrols"],
          )

          # This is a parse-only check. Flask registers application-specific
          # filters at runtime; pass-through placeholders prevent those runtime
          # registrations from requiring a database-backed app factory here.
          # Actual filter behavior is exercised only by application tests.
          for template in templates:
              source = Path("templates", template).read_text(encoding="utf-8")
              for filter_name in re.findall(r"\|\s*([A-Za-z_]\w*)", source):
                  env.filters.setdefault(
                      filter_name, lambda value, *args, **kwargs: value
                  )

          for template in templates:
              env.get_template(template)
              print("JINJA_TEMPLATE_OK", template)
          PY

      - name: Build the disposable test schema from reviewed migrations
        run: python -m flask --app 'app:create_app()' db upgrade

      # Include pre-confirmation no-dispatch assertions and rider-facing confirmed-fare copy,
      # not only the downstream request, assignment, and payment lifecycle tests.

      - name: Set up Node for browser contract tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check transport browser scripts and tracking fallback
        run: |
          node --check static/js/modules/transport/driver_offer_poll.js
          node --check static/js/modules/transport/rider_matching.js
          node --check static/js/modules/transport/rider_status_sync.js
          node --check static/js/geo/geo-realtime.js
          node --input-type=module --check < static/js/modules/transport/offer-poller.js
          node tests/test_rider_sync_driver_card.cjs
          node tests/test_geo_realtime_fallback.cjs
          node tests/test_request_tracker_polling.cjs

      - name: Run only the selected PostgreSQL regression tests
        env:
          TEST_ISOLATION_TIMINGS: "1"
        run: |
          mkdir -p artifacts
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.test_scope }}" == "full_suite" ]] || \
             [[ "${GITHUB_EVENT_NAME}" == "push" && -f tests/ci/FULL_REGRESSION_GATE ]]; then
            echo "Running final full-suite regression."
            TARGETS=(tests/)
          else
            echo "Running only the recorded failing tests."
            mapfile -t TARGETS < tests/ci/failed_test_targets.txt
            TARGETS+=(
              tests/test_celery_small_batch_contracts.py
              tests/test_transport_concurrent_claim.py::TestOfferService::test_sweep_expired_cleans_index
              tests/notifications/test_scheduled_notification_delivery.py
              tests/notifications/test_models.py
              tests/test_transport_concurrent_claim.py::TestOfferService::test_sweep_expired_cleans_index
            )
            if [[ ${#TARGETS[@]} -eq 0 ]]; then
              echo "No failed-test targets are recorded."
              exit 2
            fi
          fi
          python -m pytest -vv --continue-on-collection-errors \
            --timeout=120 --timeout-method=signal --durations=30 \
            --junitxml=artifacts/full-suite.xml \
            "${TARGETS[@]}"

      - name: Upload full-suite failure inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-postgres-${{ matrix.postgres-version }}-results
          path: artifacts/full-suite.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Redis-backed sessions, rate limiting, Celery, and Socket.IO
        if: >-
          success() &&
          (
            (github.event_name == 'workflow_dispatch' && inputs.test_scope == 'full_suite') ||
            (github.event_name == 'push' && hashFiles('tests/ci/FULL_REGRESSION_GATE') != '')
          )
        env:
          APP_ENV: docker
          FLASK_ENV: production
          DISABLE_REDIS: "0"
          SOCKETIO_ENABLED: "true"
          SOCKETIO_ASYNC_MODE: threading
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/2
          CELERY_RESULT_BACKEND: redis://localhost:6379/3
        run: python scripts/ci/redis_socketio_runtime_smoke.py
